<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>公基记忆卡 · 四川事业编 SRS</title>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#1c2430; --ink2:#5b6b7f; --line:#e3e8f0;
  --blue:#2f6fed; --blue-d:#2559c4; --red:#e5484d; --orange:#e8930c; --green:#23a06b; --purple:#7b5cd6;
  --shadow:0 2px 10px rgba(23,43,77,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.6; padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
#banner{display:none;background:#fff3cd;color:#7a5b00;border-bottom:1px solid #f0dfa8;padding:8px 12px;font-size:13px;text-align:center}
#banner.on{display:block}
header{background:linear-gradient(135deg,#2f6fed,#5b8dfa); color:#fff; padding:14px 0 12px; box-shadow:var(--shadow)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;font-weight:400;opacity:.85;margin-left:6px}
.hud{font-size:13px;opacity:.95;display:flex;gap:12px;flex-wrap:wrap}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(23,43,77,.04)}
nav .wrap{display:flex;overflow-x:auto;gap:2px}
nav button{flex:0 0 auto;border:0;background:transparent;padding:12px 14px;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
main{padding-top:14px}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.panel h3{font-size:15px;margin:16px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:13px}
.chip{display:inline-block;background:#eef3fe;color:var(--blue-d);border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px}
.chip.orange{background:#fdf1dc;color:#9a6206}
.chip.green{background:#e3f6ec;color:#1a7a51}
.chip.gray{background:#eef1f5;color:#5b6b7f}
.chip.red{background:#fde8e8;color:#b3261e}
.bar{height:8px;background:#edf1f7;border-radius:999px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#5b8dfa);border-radius:999px;transition:width .25s}
.q{font-size:19px;font-weight:600;line-height:1.55;margin:10px 0 4px;word-break:break-word}
.a{font-size:16px;line-height:1.75;background:#f7faff;border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;background:#eef3fe;color:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:#f1f4f9;color:var(--ink2)}
.btn.wide{width:100%}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:10px;padding:12px 4px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;line-height:1.25}
.rate button small{display:block;font-size:11px;font-weight:400;opacity:.9}
.r1{background:var(--red)} .r2{background:var(--orange)} .r3{background:var(--blue)} .r4{background:var(--green)}
.rate button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:12.5px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:110px;resize:vertical;font-size:12.5px;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
details summary{cursor:pointer;font-weight:700;font-size:14.5px}
details[open]{background:#fff}
ul.tight{margin:8px 0;padding-left:20px}
ul.tight li{margin:5px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:#fbfcfe;color:var(--ink2)}
.footnote{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.6}
.cardlist .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.cardlist .item .qq{font-weight:600}
.cardlist .item .aa{color:var(--ink2);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.small{font-size:12px}
.center{text-align:center}
.big{font-size:34px;font-weight:800;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fbfcfe}
.stat b{display:block;font-size:20px;color:var(--blue)}
.stat span{font-size:12px;color:var(--ink2)}
@media(max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .q{font-size:17.5px}
  .rate button{font-size:13px;padding:11px 2px}
}
</style>
</head>

<script>
/* ========== 公基记忆卡 · SRS 间隔复习系统 ==========
   算法：Leitner/SM 简化版。每张卡有一个"熟练档位"step(0-8)，
   对应间隔天数 [1,2,4,7,12,20,35,60,90]。评分四档：
   忘记→回档0且当天重来；模糊→退1档；记得→进1档；熟练→进2档。
   每天动态计算新卡额度：复习越多，新卡越少（防止雪崩）。
===================================================== */
const DECK = {"updated": "10·16 时政政治+常识PDF已并入", "note": "四川事业编公基卡片库 v1，按考试分值权重分配；p=1 表示高频必背卡", "cards": [{"d": "宪法", "p": 1, "q": "我国现行宪法是什么时候通过的？", "a": "1982年12月4日通过。此后历经1988、1993、1999、2004、2018年五次修正；12月4日为国家宪法日。"}, {"d": "宪法", "p": 1, "q": "修改宪法的程序？", "a": "由全国人大常委会或1/5以上的全国人大代表提议，并由全国人民代表大会以全体代表的2/3以上多数通过。"}, {"d": "宪法", "p": 1, "q": "全国人大与全国人大常委会的立法分工？", "a": "全国人大制定和修改刑事、民事、国家机构的和其他的基本法律；常委会制定和修改其他法律，并有权解释宪法、监督宪法实施。"}, {"d": "宪法", "p": 1, "q": "我国的国体（国家性质）是什么？", "a": "中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。"}, {"d": "宪法", "p": 1, "q": "我国的根本政治制度与基本政治制度？", "a": "根本政治制度：人民代表大会制度。基本政治制度：中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。"}, {"d": "宪法", "p": 1, "q": "国家主席的任职条件？", "a": "有选举权和被选举权的年满45周岁的中国公民；每届任期5年（2018年修宪后不再有连任届数限制）。"}, {"d": "宪法", "p": 1, "q": "哪些国家领导职务连续任职不得超过两届？", "a": "全国人大常委会委员长、副委员长，国务院总理、副总理、国务委员，国家监委主任，最高法院长，最高检检察长。注意：2018年修宪后国家主席、副主席不再受两届限制。"}, {"d": "宪法", "p": 1, "q": "逮捕公民的法定程序？", "a": "必须经人民检察院批准或者决定，或者经人民法院决定，并由公安机关执行。"}, {"d": "宪法", "p": 1, "q": "既是权利又是义务的基本权利是哪两项？", "a": "劳动权和受教育权。"}, {"d": "宪法", "q": "在什么情况下公民可以获得物质帮助权？", "a": "公民在年老、疾病或者丧失劳动能力的情况下，有从国家和社会获得物质帮助的权利。"}, {"d": "宪法", "q": "公民的政治权利和自由包括哪些？", "a": "选举权和被选举权；言论、出版、集会、结社、游行、示威的自由。"}, {"d": "宪法", "q": "民族自治地方与自治机关分别是什么？", "a": "自治地方：自治区、自治州、自治县（乡级不设自治）；自治机关：自治地方的人民代表大会和人民政府（不含法院、检察院）。"}, {"d": "宪法", "q": "特别行政区享有哪些权力？", "a": "享有高度自治权：行政管理权、立法权、独立的司法权和终审权；国防、外交权属于中央。"}, {"d": "宪法", "q": "我国的基层群众自治形式？村委会任期多长？", "a": "村民委员会、居民委员会；村委会每届任期5年，可连选连任。"}, {"d": "宪法", "q": "我国最高国家权力机关及其执行机关？", "a": "最高国家权力机关：全国人民代表大会；最高国家权力机关的执行机关：国务院。"}, {"d": "宪法", "q": "国家监察委员会何时入宪？主任任期限制？", "a": "2018年修宪时写入宪法；国家监委主任连续任职不得超过两届。"}, {"d": "刑法", "p": 1, "q": "刑法的基本原则有哪些？", "a": "罪刑法定原则、适用刑法人人平等原则、罪责刑相适应原则。"}, {"d": "刑法", "p": 1, "q": "完全负刑事责任的年龄？", "a": "已满16周岁的人犯罪，应当负刑事责任。"}, {"d": "刑法", "p": 1, "q": "14—16周岁相对负刑责的八种行为？", "a": "故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质。"}, {"d": "刑法", "p": 1, "q": "12—14周岁什么情况下要被追诉？", "a": "犯故意杀人、故意伤害罪，致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。"}, {"d": "刑法", "p": 1, "q": "什么是特别防卫？", "a": "对正在进行的行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪采取防卫行为，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任。"}, {"d": "刑法", "p": 1, "q": "犯罪未完成形态三种及其处罚？", "a": "预备：可以从轻、减轻或免除处罚；未遂：可以从轻或减轻处罚；中止：没有造成损害的免除处罚，造成损害的减轻处罚。"}, {"d": "刑法", "p": 1, "q": "主刑和附加刑分别有哪些？", "a": "主刑：管制、拘役、有期徒刑、无期徒刑、死刑。附加刑：罚金、剥夺政治权利、没收财产（驱逐出境只适用外国人）。"}, {"d": "刑法", "p": 1, "q": "缓刑的适用条件？哪三种人应当宣告缓刑？", "a": "被判处拘役或3年以下有期徒刑，且情节较轻、有悔罪表现、无再犯危险、对社区无重大不良影响，可以宣告缓刑；不满18周岁、怀孕的妇女、已满75周岁的应当宣告缓刑。"}, {"d": "刑法", "p": 1, "q": "不适用死刑的情形？", "a": "犯罪时不满18周岁的人和审判时怀孕的妇女不适用死刑；审判时已满75周岁的原则上不适用（以特别残忍手段致人死亡的除外）。"}, {"d": "刑法", "p": 1, "q": "贪污罪的构成要点？", "a": "主体是国家工作人员（含受委托管理、经营国有财产的人员）；利用职务便利侵吞、窃取、骗取或者以其他手段非法占有公共财物。"}, {"d": "刑法", "q": "受贿罪的构成？", "a": "国家工作人员利用职务上的便利，索取他人财物，或者非法收受他人财物并为他人谋取利益。"}, {"d": "刑法", "q": "滥用职权罪与玩忽职守罪的区别？", "a": "滥用职权多为故意（超越职权、乱作为）；玩忽职守是过失（不履行或不认真履行职责），二者都要求致使公共财产、国家和人民利益遭受重大损失。"}, {"d": "刑法", "q": "挪用公款归个人使用的三种情形？", "a": "进行非法活动；数额较大进行营利活动；数额较大且超过3个月未还。"}, {"d": "民法", "p": 1, "q": "民事行为能力如何划分？", "a": "不满8周岁为无民事行为能力人；8周岁以上不满18周岁为限制民事行为能力人（16周岁以上以自己劳动收入为主要生活来源的视为完全）；18周岁以上为完全民事行为能力人。"}, {"d": "民法", "p": 1, "q": "普通诉讼时效期间是多久？", "a": "3年，自权利人知道或应当知道权利受到损害以及义务人之日起计算；最长保护期20年。"}, {"d": "民法", "p": 1, "q": "哪些请求权不适用诉讼时效？", "a": "请求停止侵害、排除妨碍、消除危险；不动产物权和登记的动产物权权利人请求返还财产；请求支付抚养费、赡养费、扶养费。"}, {"d": "民法", "q": "宣告失踪和宣告死亡的条件？", "a": "宣告失踪：下落不明满2年。宣告死亡：一般下落不明满4年；因意外事故下落不明满2年；因意外事故下落不明经有关机关证明不可能生存的不受2年限制。"}, {"d": "民法", "p": 1, "q": "善意取得的三个条件？", "a": "受让人受让时是善意的；以合理价格转让；转让的动产已交付、不动产已登记。"}, {"d": "民法", "p": 1, "q": "用益物权包括哪些？", "a": "土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权。"}, {"d": "民法", "p": 1, "q": "抵押、质押、留置的区别？", "a": "抵押不转移占有；质押要转移占有（动产质押、权利质押）；留置是法定担保物权，只适用于动产。"}, {"d": "民法", "p": 1, "q": "遗嘱有哪些形式？多份遗嘱效力怎么算？", "a": "自书、代书、打印、录音录像、口头、公证六种；立有数份内容相抵触的遗嘱，以最后的有效遗嘱为准（民法典取消了公证遗嘱的优先效力）。"}, {"d": "民法", "p": 1, "q": "法定继承的顺序？", "a": "第一顺序：配偶、子女、父母；第二顺序：兄弟姐妹、祖父母、外祖父母。丧偶儿媳/女婿对公婆/岳父母尽了主要赡养义务的，作为第一顺序继承人。"}, {"d": "民法", "q": "什么是代位继承？", "a": "被继承人的子女先于被继承人死亡的，由该子女的直系晚辈血亲代位继承；民法典新增：被继承人的兄弟姐妹先于其死亡的，由其子女代位继承。"}, {"d": "民法", "p": 1, "q": "结婚的法定年龄？婚姻无效的情形？", "a": "男不得早于22周岁、女不得早于20周岁；无效婚姻：重婚、有禁止结婚的亲属关系、未到法定婚龄。"}, {"d": "民法", "q": "离婚冷静期怎么规定的？", "a": "协议离婚：自婚姻登记机关收到离婚登记申请之日起30日内，任何一方可撤回申请；冷静期届满后30日内双方应亲自申请发证，未申请的视为撤回离婚登记申请。"}, {"d": "民法", "p": 1, "q": "承担民事责任的方式有哪些（举例）？", "a": "停止侵害、排除妨碍、消除危险、返还财产、恢复原状、修理重作更换、继续履行、赔偿损失、支付违约金、消除影响恢复名誉、赔礼道歉等。"}, {"d": "民法", "q": "无民事行为能力人在学校受伤，学校怎么担责？", "a": "过错推定：学校能证明尽到教育、管理职责的不承担责任；限制民事行为能力人受损害则适用过错责任原则。"}, {"d": "民法", "q": "高空抛物如何担责？", "a": "法律禁止从建筑物中抛掷物品；公安等机关应依法及时调查；物业服务企业等未采取必要安全保障措施的承担相应责任。"}, {"d": "民法", "q": "什么是表见代理？", "a": "行为人没有代理权、超越代理权或代理权终止后仍实施代理行为，相对人有理由相信行为人有代理权的，该代理行为有效。"}, {"d": "民法", "q": "民法典共几编？分别是？", "a": "七编：总则、物权、合同、人格权、婚姻家庭、继承、侵权责任（人格权独立成编是重大亮点）。"}, {"d": "行政法", "p": 1, "q": "行政处罚的种类（要点）？", "a": "警告、通报批评；罚款、没收违法所得和非法财物；暂扣或吊销许可证件、降低资质等级；限制生产经营、责令停产停业、责令关闭、限制从业；行政拘留。"}, {"d": "行政法", "p": 1, "q": "行政处罚的追责时效？", "a": "一般2年；涉及公民生命健康安全、金融安全且有危害后果的为5年。"}, {"d": "行政法", "q": "行政处罚听证程序要点？", "a": "当事人应在行政机关告知后5日内提出听证要求；行政机关应当在举行听证的7日前通知当事人时间、地点。"}, {"d": "行政法", "p": 1, "q": "行政复议和行政诉讼的期限？", "a": "行政复议申请期限60日；行政诉讼起诉期限一般6个月；经复议后不服的，15日内向法院起诉。"}, {"d": "行政法", "q": "行政复议向谁申请？", "a": "对县级以上地方政府工作部门的行为不服，可向本级人民政府或上一级主管部门申请；对海关、金融、外汇等垂直领导部门的行为不服，向上一级主管部门申请。"}, {"d": "行政法", "q": "复议机关维持或改变原行为时，被告如何确定？", "a": "复议维持：作出原行为的机关和复议机关是共同被告；复议改变：复议机关是被告。"}, {"d": "行政法", "p": 1, "q": "国家赔偿的责任原则和请求时效？", "a": "违法归责原则（违法行使职权造成损害才赔）；请求时效2年。"}, {"d": "行政法", "p": 1, "q": "公务员处分的种类和处分期？", "a": "种类：警告、记过、记大过、降级、撤职、开除。期间：警告6个月、记过12个月、记大过18个月、降级和撤职24个月。"}, {"d": "行政法", "p": 1, "q": "新录用公务员的试用期是多久？", "a": "1年。"}, {"d": "行政法", "q": "行政行为的效力内容包括？", "a": "公定力、确定力、拘束力、执行力。"}, {"d": "行政法", "q": "什么是行政许可？", "a": "行政机关根据公民、法人或其他组织的申请，经依法审查，准予其从事特定活动的行为。"}, {"d": "劳动", "p": 1, "q": "试用期期限有什么限制？", "a": "劳动合同3个月以上不满1年：试用期不超过1个月；1年以上不满3年：不超过2个月；3年以上固定期限和无固定期限：不超过6个月。"}, {"d": "劳动", "p": 1, "q": "试用期工资标准？", "a": "不得低于本单位相同岗位最低档工资或劳动合同约定工资的80%，并不得低于用工所在地最低工资标准。"}, {"d": "劳动", "p": 1, "q": "加班工资怎么算？", "a": "平时延长工作时间不低于150%；休息日安排工作又不能补休的不低于200%；法定节假日不低于300%。"}, {"d": "劳动", "q": "经济补偿怎么算？", "a": "每满1年支付1个月工资；6个月以上不满1年按1年算；不满6个月支付半个月工资。"}, {"d": "劳动", "p": 1, "q": "哪些情形应当认定为工伤？", "a": "在工作时间和工作场所内因工作原因受到事故伤害；工作时间前后在工作场所内从事与工作有关的预备性或收尾性工作受伤；上下班途中受到非本人主要责任的交通事故等。"}, {"d": "劳动", "q": "领取失业保险金的条件？", "a": "失业前用人单位和本人已缴纳失业保险费满1年；非因本人意愿中断就业；已办理失业登记并有求职要求。"}, {"d": "公文", "p": 1, "q": "党政机关15种法定公文文种？", "a": "决议、决定、命令(令)、公报、公告、通告、意见、通知、通报、报告、请示、批复、议案、函、纪要。"}, {"d": "公文", "p": 1, "q": "请示和报告有什么区别？", "a": "请示：事前行文、一文一事、必须答复（向上级请求指示或批准）；报告：汇报工作反映情况、一般不要求答复、不得夹带请示事项。"}, {"d": "公文", "p": 1, "q": "公告和通告的区别？", "a": "公告面向国内外宣布重要事项或法定事项；通告在一定范围内公布应当遵守或周知的事项。"}, {"d": "公文", "p": 1, "q": "通知和通报的区别？", "a": "通知：发布规章、传达要求下级执行或周知的事项、批转转发公文、任免人员；通报：表彰先进、批评错误、传达重要精神和告知重要情况。"}, {"d": "公文", "p": 1, "q": "函适用于什么？", "a": "不相隶属机关之间商洽工作、询问和答复问题、请求批准和答复审批事项。"}, {"d": "公文", "p": 1, "q": "纪要的适用与格式特殊点？", "a": "适用于记载会议主要情况和议定事项；纪要一般不加盖印章。"}, {"d": "公文", "q": "命令(令)的四种用途？", "a": "公布行政法规和规章；宣布施行重大强制性措施；批准授予和晋升衔级；嘉奖有关单位和人员。"}, {"d": "公文", "p": 1, "q": "批复和意见分别适用于什么？", "a": "批复：答复下级机关请示事项；意见：对重要问题提出见解和处理办法，可上行、下行、平行行文。"}, {"d": "公文", "q": "决议和决定的区别？", "a": "决议适用于会议讨论通过的重大决策事项；决定适用于对重要事项作出决策和部署、奖惩有关单位和人员、变更或撤销下级机关不适当决定。"}, {"d": "公文", "q": "议案适用于什么？", "a": "各级人民政府按照法律程序向本级人民代表大会或其常务委员会提请审议事项。"}, {"d": "公文", "p": 1, "q": "公文格式分哪三个部分？各含哪些要素？", "a": "版头：份号、密级和保密期限、紧急程度、发文机关标志、发文字号、签发人；主体：标题、主送机关、正文、附件说明、发文机关署名、成文日期、印章、附注、附件；版记：抄送机关、印发机关和印发日期、页码。"}, {"d": "公文", "p": 1, "q": "发文字号的组成规则？", "a": "发文机关代字+年份+发文顺序号；年份用六角括号〔〕括入并标全称，如〔2026〕；顺序号不加“第”字、不编虚位（不写01）、后加“号”字。"}, {"d": "公文", "p": 1, "q": "公文标题的构成与省略规则？", "a": "发文机关+事由+文种，可省略发文机关；标题中除法规、规章名称加书名号外，一般不用标点符号。"}, {"d": "公文", "p": 1, "q": "成文日期怎么标？以什么时间为准？", "a": "用阿拉伯数字标全年、月、日，月日不编虚位；以负责人签发的日期为准，联合行文以最后签发机关负责人签发的日期为准。"}, {"d": "公文", "q": "密级和紧急程度分别有哪些？", "a": "密级：秘密、机密、绝密（绝密最高）；紧急程度：特急、加急；电报：特提、特急、加急、平急。"}, {"d": "公文", "p": 1, "q": "公文中的“签发人”什么时候标注？", "a": "上行文应当标注签发人姓名（下行文、平行文不标）。"}, {"d": "公文", "p": 1, "q": "行文规则的三条核心？", "a": "原则上不得越级行文；向上级机关行文原则上主送一个上级机关，不得抄送下级机关；请示应当一文一事，报告中不得夹带请示事项。"}, {"d": "公文", "q": "受双重领导的机关如何行文？", "a": "向一个上级机关行文，必要时抄送另一个上级机关。"}, {"d": "公文", "q": "向下级机关的重要行文要不要抄送？", "a": "向下级机关或本系统的重要行文，应当同时抄送发文机关的直接上级机关。"}, {"d": "公文", "p": 1, "q": "收文办理的程序？", "a": "签收、登记、初审、承办、传阅、催办、答复。"}, {"d": "公文", "p": 1, "q": "发文办理的程序？", "a": "复核、登记、印制、核发。"}, {"d": "公文", "q": "办毕公文如何处置？", "a": "需要归档的及时归档；不具备归档和保存价值的按规定销毁；涉密公文按规定清退或销毁。"}, {"d": "公文", "q": "附件说明和附件的位置区别？", "a": "附件说明标注附件名称和序号，写在正文之后、发文机关署名之前；附件另页附在正文之后。"}, {"d": "公文", "q": "公文语言的特点？", "a": "准确、简明、庄重、朴实、规范。"}, {"d": "公文", "q": "公文的主要作用？", "a": "领导和指导作用、规范作用、宣传教育作用、联系沟通作用、凭证依据作用。"}, {"d": "马哲", "p": 1, "q": "哲学基本问题是哪两个方面？", "a": "思维和存在（意识和物质）的关系：第一，谁是第一性（划分唯物主义和唯心主义）；第二，思维能否正确认识存在（划分可知论和不可知论）。"}, {"d": "马哲", "p": 1, "q": "物质的唯一特性是什么？", "a": "客观实在性；运动是物质的根本属性和存在方式。"}, {"d": "马哲", "p": 1, "q": "意识的能动作用表现在哪些方面？", "a": "意识活动具有目的性和计划性、主动创造性；意识能指导实践改造世界；能调控人的行为和生理活动。但意识是物质的产物和反映。"}, {"d": "马哲", "p": 1, "q": "唯物辩证法的三大规律？", "a": "对立统一规律（实质与核心）、质量互变规律、否定之否定规律。"}, {"d": "马哲", "p": 1, "q": "矛盾特殊性的方法论意义？", "a": "具体问题具体分析（马克思主义活的灵魂）；矛盾普遍性与特殊性的关系就是共性与个性的关系。"}, {"d": "马哲", "p": 1, "q": "实践与认识的关系？", "a": "实践是认识的来源、动力、目的和检验真理的唯一标准；认识对实践具有反作用（正确认识促进、错误认识阻碍）。"}, {"d": "马哲", "q": "真理有哪些属性？", "a": "客观性（真理内容是客观的）；具体性和条件性；绝对性与相对性的统一。"}, {"d": "马哲", "p": 1, "q": "唯物史观的两大基本规律？", "a": "生产力决定生产关系、生产关系反作用于生产力；经济基础决定上层建筑、上层建筑反作用于经济基础。社会基本矛盾是社会发展的根本动力。"}, {"d": "马哲", "q": "社会存在与社会意识的关系？", "a": "社会存在决定社会意识；社会意识具有相对独立性，对社会存在有能动的反作用。"}, {"d": "马哲", "p": 1, "q": "为什么说人民群众是历史的创造者？", "a": "人民群众是社会物质财富和精神财富的创造者，是社会变革的决定力量；要坚持群众观点和群众路线。"}, {"d": "马哲", "q": "量变与质变的辩证关系？", "a": "量变是质变的必要准备，质变是量变的必然结果；要重视量的积累，抓住时机促成质变。"}, {"d": "马哲", "q": "发展的实质是什么？", "a": "新事物的产生和旧事物的灭亡（发展的实质是事物的前进和上升）。"}, {"d": "党史", "p": 1, "q": "毛泽东思想的活的灵魂？", "a": "实事求是（是精髓）、群众路线、独立自主。"}, {"d": "党史", "p": 1, "q": "中国革命的三大法宝？", "a": "统一战线、武装斗争、党的建设。"}, {"d": "党史", "p": 1, "q": "新民主主义革命总路线？", "a": "无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。"}, {"d": "党史", "p": 1, "q": "中国革命走的是什么道路？", "a": "农村包围城市、武装夺取政权（井冈山道路）。"}, {"d": "党史", "p": 1, "q": "中共一大什么时候在哪里召开？", "a": "1921年7月，上海——后转移到浙江嘉兴南湖游船上；这是党诞生的标志。"}, {"d": "党史", "q": "遵义会议的意义？", "a": "1935年1月召开，确立了毛泽东在党中央和红军的领导地位，是党的历史上生死攸关的转折点。"}, {"d": "党史", "q": "八七会议提出了什么著名论断？", "a": "1927年8月7日，毛泽东提出“枪杆子里面出政权”。"}, {"d": "党史", "p": 1, "q": "中共七大什么时候召开？有何重大意义？", "a": "1945年在延安召开，确立毛泽东思想为党的指导思想并写入党章。"}, {"d": "党史", "q": "党的三大优良作风？", "a": "理论联系实际、密切联系群众、批评与自我批评。"}, {"d": "党史", "p": 1, "q": "“两个务必”和“三个务必”分别是什么？", "a": "两个务必（七届二中全会）：务必保持谦虚、谨慎、不骄、不躁的作风，务必保持艰苦奋斗的作风。三个务必（二十大）：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。"}, {"d": "党史", "p": 1, "q": "十一届三中全会的意义？", "a": "1978年12月召开，把党和国家工作重心转移到经济建设上来，实行改革开放，是党的历史上具有深远意义的伟大转折。"}, {"d": "党史", "q": "中共十四大的重大贡献？", "a": "1992年召开，确立我国经济体制改革的目标是建立社会主义市场经济体制。"}, {"d": "党史", "p": 1, "q": "我国社会主要矛盾在十九大上怎么表述？", "a": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾（此前1981年表述为：人民日益增长的物质文化需要同落后的社会生产之间的矛盾）。"}, {"d": "党史", "p": 1, "q": "邓小平理论的首要基本问题？社会主义的本质是什么？", "a": "首要基本问题：什么是社会主义、怎样建设社会主义。社会主义本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。"}, {"d": "中特", "p": 1, "q": "“两个确立”是什么？", "a": "确立习近平同志党中央的核心、全党的核心地位；确立习近平新时代中国特色社会主义思想的指导地位。"}, {"d": "中特", "p": 1, "q": "“五位一体”总体布局？", "a": "经济建设、政治建设、文化建设、社会建设、生态文明建设。"}, {"d": "中特", "p": 1, "q": "“四个全面”战略布局？", "a": "全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"}, {"d": "中特", "p": 1, "q": "新发展理念五个词？", "a": "创新、协调、绿色、开放、共享。"}, {"d": "中特", "p": 1, "q": "中国式现代化的五个特征？", "a": "人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。"}, {"d": "中特", "p": 1, "q": "高质量发展的定位？新发展格局是什么？", "a": "高质量发展是全面建设社会主义现代化国家的首要任务；新发展格局：以国内大循环为主体、国内国际双循环相互促进。"}, {"d": "中特", "q": "新时代党的建设总要求中的“主线”是什么？", "a": "加强党的长期执政能力建设、先进性和纯洁性建设。"}, {"d": "中特", "q": "党的根本宗旨和初心使命？", "a": "根本宗旨：全心全意为人民服务。初心使命：为中国人民谋幸福、为中华民族谋复兴。"}, {"d": "中特", "q": "习近平新时代中国特色社会主义思想回答了什么课题？“十个明确”是什么层面的概括？", "a": "系统回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义（集中体现为“十个明确”“十四个坚持”“十三个方面成就”）。"}, {"d": "中特", "p": 1, "q": "二十届三中全会的主题？", "a": "进一步全面深化改革、推进中国式现代化（2024年7月召开）。"}, {"d": "中特", "p": 1, "q": "二十届四中全会通过了什么重要文件？", "a": "2025年10月20日—23日召开，审议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。"}, {"d": "中特", "q": "党的根本组织原则和领导制度？", "a": "民主集中制（民主基础上的集中和集中指导下的民主相结合）。"}, {"d": "中特", "q": "“三个有利于”判断标准？", "a": "是否有利于发展社会主义社会的生产力、是否有利于增强社会主义国家的综合国力、是否有利于提高人民的生活水平。"}, {"d": "中特", "q": "“一国两制”构想由谁为解决什么问题提出？", "a": "邓小平为解决台湾问题而提出；成功实践于香港（1997年）、澳门（1999年）回归。"}, {"d": "中特", "q": "党的“六大纪律”指哪些？", "a": "政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。"}, {"d": "中特", "q": "入党的年龄条件和预备期？", "a": "年满18周岁、承认党的纲领和章程等；预备期为1年。"}, {"d": "道德", "p": 1, "q": "社会主义核心价值观24字？", "a": "国家层面：富强、民主、文明、和谐；社会层面：自由、平等、公正、法治；个人层面：爱国、敬业、诚信、友善。"}, {"d": "道德", "q": "公民基本道德规范？", "a": "爱国守法、明礼诚信、团结友善、勤俭自强、敬业奉献。"}, {"d": "道德", "q": "社会公德的主要内容？", "a": "文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法。"}, {"d": "道德", "q": "职业道德的主要内容？", "a": "爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。"}, {"d": "时政", "p": 1, "q": "“十五五”规划建议是何时通过的？结构如何？", "a": "2025年10月党的二十届四中全会审议通过；全文共15个部分、61条，分三大板块。"}, {"d": "时政", "p": 1, "q": "“十五五”规划纲要何时审查批准？2026年是什么年？", "a": "2026年3月十四届全国人大四次会议审查批准；2026年是“十五五”开局之年。"}, {"d": "时政", "p": 1, "q": "“十五五”主要目标的7个方面？", "a": "高质量发展取得显著成效、科技自立自强水平大幅提高、进一步全面深化改革取得新突破、社会文明程度明显提升、人民生活品质不断提高、美丽中国建设取得新的重大进展、国家安全屏障更加巩固。"}, {"d": "时政", "p": 1, "q": "“十五五”时期必须遵循的“六个坚持”原则？", "a": "坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全。"}, {"d": "时政", "p": 1, "q": "2026年发展主要预期目标（数字要记）？", "a": "经济增长4.5%—5%；城镇调查失业率5.5%左右；城镇新增就业1200万人以上；居民消费价格涨幅2%左右；粮食产量1.4万亿斤左右；单位GDP二氧化碳排放降低3.8%左右。"}, {"d": "时政", "p": 1, "q": "“十五五”规划纲要提出多少项重大工程？", "a": "6方面109项重大工程（新质生产力28项、现代化基础设施23项等）。"}, {"d": "时政", "q": "2026年政府工作报告提出的新兴支柱产业和未来产业？", "a": "新兴支柱产业：集成电路、航空航天、生物医药、低空经济；未来产业：未来能源、量子科技、具身智能、脑机接口、6G；并部署整治“内卷式”竞争、深化“人工智能+”行动。"}, {"d": "时政", "q": "2026年有哪些重要周年纪念？", "a": "建党105周年（7月1日）、长征胜利90周年（10月）、辛亥革命115周年（10月10日）、孙中山诞辰160周年。"}, {"d": "时政", "p": 1, "q": "2025年最重大的纪念活动是什么？", "a": "纪念中国人民抗日战争暨世界反法西斯战争胜利80周年（2025年9月3日）；同时“十四五”规划圆满收官。"}, {"d": "时政", "p": 1, "q": "四川“四化同步、城乡融合、五区共兴”中“五区”指哪五个区？", "a": "成都平原经济区、川南经济区、川东北经济区、攀西经济区、川西北生态示范区。"}, {"d": "时政", "p": 1, "q": "2026年四川省政府工作报告的总体取向？", "a": "深入实施“四化同步、城乡融合、五区共兴”发展战略，全力以赴拼经济搞建设，提升成渝地区双城经济圈发展能级，建设现代化经济强省，“十五五”时期经济增速保持高于全国平均水平。"}, {"d": "时政", "q": "四川2026年布局的重大科技专项？", "a": "加快前沿科技攻坚，布局实施人工智能、高端航空装备等9个重大科技专项（此前省委十二届五次全会部署人工智能、航空航天、先进装备、生物制造、清洁能源、先进材料6个重大科技专项）。"}, {"d": "时政", "q": "四川获批的国家级平台、四川的算力地位？", "a": "获批建设国家数字经济创新发展试验区；提速优化“东数西算”国家枢纽节点建设；成都纳入全国要素市场化配置综合改革试点。"}, {"d": "时政", "q": "四川城市工作的口号？", "a": "建设具有四川特色的现代化人民城市，围绕“公园城市、安逸家园”，支持成都深化建设践行新发展理念的公园城市示范区。"}, {"d": "经济", "p": 1, "q": "商品的二因素与劳动二重性？", "a": "商品二因素：使用价值和价值（价值是商品特有的社会属性）；劳动二重性：具体劳动创造使用价值，抽象劳动创造价值。"}, {"d": "经济", "p": 1, "q": "剩余价值率怎么算？", "a": "剩余价值率＝剩余价值÷可变资本＝剩余劳动时间÷必要劳动时间。"}, {"d": "经济", "q": "绝对剩余价值与相对剩余价值的区别？", "a": "绝对剩余价值：延长工作日的绝对长度；相对剩余价值：提高劳动生产率、缩短必要劳动时间。"}, {"d": "经济", "p": 1, "q": "GDP、CPI、PPI分别是什么？", "a": "GDP：国内生产总值（地域概念）；CPI：居民消费价格指数；PPI：工业生产者出厂价格指数。"}, {"d": "经济", "p": 1, "q": "基尼系数与恩格尔系数分别衡量什么？", "a": "基尼系数衡量收入分配差距（0—1之间，0.4为警戒线）；恩格尔系数：食品支出占消费总支出的比重（越低越富裕）。"}, {"d": "经济", "p": 1, "q": "治理通货膨胀用什么政策组合？", "a": "紧缩性财政政策（减少支出、增加税收）＋紧缩性货币政策（提高存款准备金率、提高利率、公开市场卖出）。"}, {"d": "经济", "p": 1, "q": "三大货币政策工具？", "a": "存款准备金率、再贴现（率）、公开市场业务。"}, {"d": "经济", "q": "财政政策的工具？", "a": "税收、国债、政府购买支出、转移支付。"}, {"d": "经济", "q": "失业的三种类型？", "a": "摩擦性失业、结构性失业、周期性失业。"}, {"d": "经济", "p": 1, "q": "社会保障体系包括哪些？核心和最低层次分别是什么？", "a": "社会保险、社会救助、社会福利、社会优抚；社会保险是核心，社会救助是最低层次，社会优抚对象是军人及其家属。"}, {"d": "经济", "q": "初次分配、再分配、第三次分配？", "a": "初次分配：市场按要素分配；再分配：政府通过税收、社保等调节；第三次分配：社会自愿的公益慈善。"}, {"d": "经济", "q": "供求与价格的关系？", "a": "商品价格围绕价值上下波动；供不应求价格上涨，供过于求价格下跌；价格变动又调节供求。"}, {"d": "管理", "p": 1, "q": "管理的四项基本职能？", "a": "计划、组织、领导、控制（贯穿其中的是决策）。"}, {"d": "管理", "q": "管理幅度与管理层次的关系？", "a": "反比关系：管理幅度越大，管理层次越少（组织结构趋于扁平化）。"}, {"d": "管理", "p": 1, "q": "马斯洛需求层次理论的五个层次？", "a": "生理需要、安全需要、社交（归属与爱）需要、尊重需要、自我实现需要。"}, {"d": "管理", "p": 1, "q": "赫茨伯格双因素理论？", "a": "保健因素（工资、政策、工作环境等）只能消除不满；激励因素（成就、认可、工作本身等）才能带来满意。"}, {"d": "管理", "q": "目标管理（MBO）由谁提出？核心是什么？", "a": "德鲁克提出；核心：以目标为导向、员工参与、自我控制、重视成果。"}, {"d": "管理", "q": "木桶效应、蝴蝶效应、马太效应分别是什么？", "a": "木桶效应：整体受短板制约；蝴蝶效应：微小变化引起巨大连锁反应；马太效应：强者愈强、弱者愈弱。"}, {"d": "管理", "q": "晕轮效应、首因效应、近因效应是什么？", "a": "晕轮效应：以偏概全的光环偏差；首因效应：第一印象影响判断；近因效应：最近获得的信息影响更大。"}, {"d": "管理", "q": "破窗效应、鲶鱼效应、羊群效应、手表定律？", "a": "破窗：小问题不及时纠正会蔓延；鲶鱼：引入竞争激发活力；羊群：从众跟风；手表定律：多头标准反而无法行动。"}, {"d": "管理", "p": 1, "q": "事业单位岗位分为哪三类？", "a": "管理岗位、专业技术岗位、工勤技能岗位。"}, {"d": "管理", "p": 1, "q": "事业单位工作人员处分的种类？", "a": "警告、记过、降低岗位等级或撤职、开除（共4种）。"}, {"d": "管理", "p": 1, "q": "事业单位工作人员考核的内容和结果等次？", "a": "内容：德、能、勤、绩、廉；结果分为优秀、合格、基本合格、不合格四个等次。"}, {"d": "管理", "p": 1, "q": "事业单位聘用合同期限和试用期？", "a": "聘用合同期限一般不低于3年；初次就业且合同期限3年以上的，试用期为12个月。"}, {"d": "管理", "q": "事业单位改革的方向？", "a": "政事分开、事企分开、管办分离，强化公益属性（公益一类、公益二类分类改革）。"}, {"d": "管理", "q": "事业单位可以解除聘用合同的旷工情形？", "a": "连续旷工超过15个工作日，或1年内累计旷工超过30个工作日。"}, {"d": "人文", "p": 1, "q": "我国第一部诗歌总集是什么？分哪三部分？", "a": "《诗经》，收录西周初年至春秋中叶305篇，分为风、雅、颂三部分。"}, {"d": "人文", "p": 1, "q": "屈原的文学地位与代表作？", "a": "我国第一位伟大的爱国诗人，楚辞体代表；代表作《离骚》《九歌》《天问》。"}, {"d": "人文", "p": 1, "q": "“四书五经”指哪些？", "a": "四书：《大学》《中庸》《论语》《孟子》；五经：《诗经》《尚书》《礼记》《周易》《春秋》。"}, {"d": "人文", "p": 1, "q": "《史记》和《资治通鉴》的体裁？作者？", "a": "《史记》：司马迁著，我国第一部纪传体通史；《资治通鉴》：司马光著，编年体通史。"}, {"d": "人文", "q": "百家争鸣的代表人物及主张？", "a": "孔子（仁、礼）、孟子（仁政）、荀子（性恶论）、老子（道法自然）、庄子（逍遥）、韩非（法术势、以法治国）、墨子（兼爱、非攻）。"}, {"d": "人文", "p": 1, "q": "唐宋八大家是谁？", "a": "韩愈、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。"}, {"d": "人文", "p": 1, "q": "李白、杜甫的雅号？初唐四杰？", "a": "李白“诗仙”、杜甫“诗圣”；初唐四杰：王勃、杨炯、卢照邻、骆宾王。"}, {"d": "人文", "p": 1, "q": "宋词的豪放派和婉约派代表？", "a": "豪放派：苏轼、辛弃疾；婉约派：柳永、李清照。"}, {"d": "人文", "q": "元曲四大家/代表作？", "a": "关汉卿《窦娥冤》、王实甫《西厢记》、马致远《天净沙·秋思》等。"}, {"d": "人文", "p": 1, "q": "四大名著作者分别是谁？", "a": "《三国演义》罗贯中、《水浒传》施耐庵、《西游记》吴承恩、《红楼梦》曹雪芹。"}, {"d": "人文", "p": 1, "q": "鲁迅的代表作有哪些？", "a": "小说集《呐喊》《彷徨》，小说《阿Q正传》，散文集《朝花夕拾》，杂文集《坟》等；中国现代文学奠基人。"}, {"d": "人文", "p": 1, "q": "老舍的代表作？“人民艺术家”指谁？", "a": "老舍：《骆驼祥子》《四世同堂》《茶馆》《龙须沟》；老舍被誉为“人民艺术家”。"}, {"d": "人文", "q": "巴金和曹禺的代表作？", "a": "巴金：《家》《春》《秋》（激流三部曲）、《寒夜》；曹禺：话剧《雷雨》《日出》《原野》《北京人》。"}, {"d": "人文", "q": "茅盾的代表作？", "a": "《子夜》《林家铺子》；农村三部曲：《春蚕》《秋收》《残冬》。"}, {"d": "人文", "q": "沈从文、朱自清、徐志摩的代表作？", "a": "沈从文《边城》；朱自清《背影》《荷塘月色》；徐志摩（新月派）《再别康桥》。"}, {"d": "人文", "p": 1, "q": "中国古代著名战役与其结果（记四场）？", "a": "长平之战：秦胜赵（白起、赵括）；巨鹿之战：项羽破秦；官渡之战：曹操胜袁绍；赤壁之战：孙刘联军胜曹，奠定三国鼎立基础；淝水之战：东晋胜前秦（“草木皆兵”）。"}, {"d": "人文", "p": 1, "q": "科举制何时创立、何时废除？“连中三元”指什么？", "a": "隋朝创立，1905年废除；连中三元＝乡试解元＋会试会元＋殿试状元。"}, {"d": "人文", "p": 1, "q": "二十四节气反映什么？从哪个节气开始？", "a": "反映太阳周年运动；从立春开始到大寒结束；2016年列入联合国人类非物质文化遗产。"}, {"d": "人文", "q": "古代年龄称谓：20、30、40、50、60、70、100分别称什么？", "a": "弱冠20、而立30、不惑40、知天命50、花甲60、古稀70、期颐100。"}, {"d": "人文", "q": "书法绘画常识（记四个）？", "a": "王羲之《兰亭序》为“天下第一行书”；楷书颜真卿、柳公权（颜筋柳骨）；吴道子被称“画圣”；张择端《清明上河图》、王希孟《千里江山图》。"}, {"d": "人文", "p": 1, "q": "中国近代史的开端和第一个不平等条约？", "a": "1840年鸦片战争是中国近代史的开端；1842年《南京条约》是中国近代第一个不平等条约（割香港岛、五口通商）。"}, {"d": "人文", "q": "甲午中日战争的时间与结果条约？", "a": "1894—1895年；《马关条约》割让台湾及澎湖列岛；黄海海战中邓世昌壮烈殉国。"}, {"d": "人文", "p": 1, "q": "辛亥革命的标志事件与意义？", "a": "1911年10月10日武昌起义；推翻了封建帝制、建立了共和制度。"}, {"d": "人文", "p": 1, "q": "五四运动的时间和历史地位？", "a": "1919年爆发；是中国新民主主义革命的开端。"}, {"d": "人文", "p": 1, "q": "建党、建军的标志事件？", "a": "建党：1921年中共一大；建军：1927年南昌起义（8月1日建军节）。"}, {"d": "人文", "p": 1, "q": "九一八事变、西安事变、七七事变的意义？", "a": "1931年九一八事变：局部抗战开始；1936年西安事变：抗日民族统一战线初步形成；1937年七七事变：全面抗战开始。"}, {"d": "人文", "p": 1, "q": "抗战胜利的关键时间点？", "a": "1945年8月15日日本宣布无条件投降；9月3日为中国人民抗日战争胜利纪念日；12月13日为南京大屠杀死难者国家公祭日。"}, {"d": "人文", "p": 1, "q": "长征的起止时间与三大主力会师？", "a": "1934年10月开始；1936年10月红军三大主力在甘肃会宁会师，长征胜利结束（2026年为长征胜利90周年）。"}, {"d": "人文", "q": "文艺复兴的核心思想与代表人物？", "a": "核心思想：人文主义；文学三杰：但丁（《神曲》）、彼特拉克、薄伽丘；美术三杰：达·芬奇、米开朗基罗、拉斐尔。"}, {"d": "人文", "q": "新航路开辟与世界资产阶级革命的标志文件？", "a": "1492年哥伦布到达美洲，麦哲伦船队首次环球航行；英国1689年《权利法案》、美国1776年《独立宣言》、法国1789年《人权宣言》。"}, {"d": "人文", "q": "两次世界大战与联合国、十月革命？", "a": "一战1914—1918年；二战1939—1945年；1917年俄国十月革命建立世界上第一个社会主义国家；1945年联合国成立。"}, {"d": "人文", "q": "中国传统节日与主要习俗（春节、端午、中秋、重阳）？", "a": "春节：贴春联、守岁；端午：赛龙舟、吃粽子（纪念屈原）；中秋：赏月、吃月饼；重阳：登高、敬老。"}, {"d": "科技", "p": 1, "q": "中国古代四大发明？", "a": "造纸术、印刷术、火药、指南针。"}, {"d": "科技", "p": 1, "q": "中国空间站、载人飞船、月球探测工程分别叫什么？", "a": "空间站“天宫”；载人飞船“神舟”；月球探测“嫦娥”（嫦娥六号于2024年实现世界首次月球背面采样返回）。"}, {"d": "科技", "q": "北斗和C919？", "a": "北斗三号全球卫星导航系统2020年建成开通；C919是我国自主研制的大型客机，2023年完成商业首航。"}, {"d": "科技", "p": 1, "q": "双碳目标是什么？", "a": "二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和。"}, {"d": "科技", "q": "量子科技的代表性成果？", "a": "“墨子号”量子科学实验卫星、“九章”量子计算原型机、“祖冲之号”超导量子计算原型机。"}, {"d": "科技", "p": 1, "q": "发现天然气泄漏应该怎么做？", "a": "立即关闭阀门、开窗通风；严禁明火、严禁开关电器（包括开灯、打电话）；人员撤离到室外后再报警。"}, {"d": "科技", "q": "火灾逃生要点？", "a": "湿毛巾捂口鼻、低姿弯腰沿疏散通道撤离；不乘电梯；逆风逃生；无法逃生时到背火房间封堵门缝等待救援。"}, {"d": "科技", "q": "触电急救的正确步骤？", "a": "先切断电源或用干燥绝缘物挑开电线；不可直接拉拽触电者；脱离电源后立即施救并拨打120。"}, {"d": "科技", "q": "地震发生时室内怎么避险？", "a": "就近躲避在坚固家具旁或卫生间等小开间，护住头颈；震后有序撤离，不乘电梯；室外远离高大建筑物和山崖。"}, {"d": "科技", "q": "食物中毒和中暑的处置？", "a": "食物中毒：及时催吐并就医，保留剩余食物样本；中暑：迅速移至阴凉通风处、补充含盐水分、严重者立即送医。"}, {"d": "省情", "p": 1, "q": "四川的简称、面积和行政区划？", "a": "简称川（蜀）；面积48.6万平方公里，居全国第5位；辖21个市（州）（18个市、3个自治州）。"}, {"d": "省情", "p": 1, "q": "四川的地形特点？“天府之国”指哪里？", "a": "地跨四川盆地、川西高原等；成都平原沃野千里，被誉为“天府之国”。"}, {"d": "省情", "p": 1, "q": "四川主要河流及“千河之省”的含义？", "a": "长江（金沙江）、岷江、沱江、嘉陵江、大渡河、雅砻江等；金沙江与岷江在宜宾汇合后始称长江，四川素有“千河之省”之称。"}, {"d": "省情", "p": 1, "q": "都江堰由谁主持修建？何时列入世界文化遗产？", "a": "战国时期秦国蜀郡太守李冰父子主持修建（无坝引水工程）；2000年与青城山共同列入世界文化遗产。"}, {"d": "省情", "p": 1, "q": "四川的世界遗产有哪些（6处）？", "a": "九寨沟、黄龙、峨眉山—乐山大佛、青城山—都江堰、四川大熊猫栖息地、中国南方喀斯特（兴文石海）。"}, {"d": "省情", "q": "三星堆和金沙遗址分别在哪儿？代表文物？", "a": "三星堆在广汉（青铜文明，青铜神树、纵目面具）；金沙遗址在成都（太阳神鸟金饰）。"}, {"d": "省情", "p": 1, "q": "四川最高的山？“蜀山之王”是谁？", "a": "贡嘎山，海拔7556米，被誉为“蜀山之王”；峨眉山海拔3099米。"}, {"d": "省情", "q": "四川代表性的历史文化名人（记四个）？", "a": "李白（江油）、杜甫（成都草堂）、苏轼（眉山三苏）、邓小平（广安）、朱德（仪陇）。"}, {"d": "省情", "p": 1, "q": "大熊猫国家公园何时设立？跨哪些省？", "a": "2021年正式设立，跨四川、陕西、甘肃三省；四川野生大熊猫种群数量全国第一。"}, {"d": "省情", "q": "四川与三线建设、航天的关联？", "a": "西昌卫星发射中心；攀枝花钢铁基地；成昆铁路是“三线建设”的代表性工程。"}, {"d": "省情", "q": "蜀绣、川剧等非物质文化遗产？", "a": "蜀绣是中国四大名绣之一（苏绣、湘绣、粤绣、蜀绣）；川剧绝活“变脸”；泸沽湖摩梭文化。"}, {"d": "省情", "p": 1, "q": "成渝地区双城经济圈的定位？", "a": "2020年中央财经委员会第六次会议提出；打造带动全国高质量发展的重要增长极和新的动力源。"}, {"d": "省情", "q": "四川重要的红色文化地标？", "a": "泸定桥（飞夺泸定桥）、川陕革命根据地（巴中）、红军长征在四川的众多遗址。"}, {"d": "综测", "p": 1, "q": "四川《综合能力测试》三道题的一般结构？", "a": "第一题：根据材料写内容摘要/编者按/导言（300—400字）；第二题：撰写某篇公文（事务文书居多）的某一部分，如调研方案的“调研内容”、报告的“优化建议”；第三题：大公文或大作文（800—1000字，有时要求不拘泥于背景材料）。"}, {"d": "综测", "p": 1, "q": "综测材料常考哪些场景？", "a": "事业单位日常工作场景：公共文化服务、科普宣传、智慧河长制、未成年人保护、社会体育、教育资源均衡、医疗卫生、科技馆科普等。"}, {"d": "综测", "p": 1, "q": "大作文的万能五段结构？", "a": "第一段：引材料＋亮明总论点；第二至四段：三个分论点段（分论点＋阐释＋例证＋回扣）；第五段：总结全文＋升华主题（呼应时代与岗位）。"}, {"d": "综测", "p": 1, "q": "分论点段内部怎么写？", "a": "四步：①亮分论点（句式整齐）②解释内涵（2—3句）③举例或说理（1—2个例子）④回扣总结（1句）。"}, {"d": "综测", "p": 1, "q": "对策类分论点的常见角度？", "a": "制度机制、人才队伍、技术赋能（数字化）、宣传引导、多元参与、经费保障、监督考核。"}, {"d": "综测", "q": "大作文标题的三种公式？", "a": "①对策式：以××绘就××新画卷；②意义式：让××成为××的××；③引用式：从“××”说开去。"}, {"d": "综测", "q": "事业单位写作要突出的“岗位特色”是什么？", "a": "公益属性、公共服务、群众需求导向；写作时多落在“服务群众最后一公里”“公共文化服务均等化”“便民惠民”等角度。"}, {"d": "综测", "p": 1, "q": "综述题（概括题）答题三步？", "a": "①审题定范围（对象、范围、字数）；②回材料划关键词（主体＋做法＋结果）；③分条书写（一是…二是…三是…，每条“核心词＋具体内容”）。"}, {"d": "综测", "q": "公文片段（如报告的“优化建议”部分）怎么写？", "a": "先总起一句（针对……提出如下建议），再分条：一是…二是…三是…；每条“动宾结构＋具体措施”，尽量用材料中的关键词。"}, {"d": "综测", "p": 1, "q": "作文金句：关于人民？", "a": "“人民对美好生活的向往，就是我们的奋斗目标”“江山就是人民，人民就是江山”“民生无小事，枝叶总关情”。"}, {"d": "综测", "q": "作文金句：关于担当实干？", "a": "“功成不必在我、功成必定有我”“空谈误国，实干兴邦”“干部干部，干是当头的”。"}, {"d": "综测", "q": "作文金句：关于文化与青年？", "a": "“文化自信是更基本、更深沉、更持久的力量”“青年兴则国家兴，青年强则国家强”“让收藏在博物馆里的文物、陈列在广阔大地上的遗产、书写在古籍里的文字活起来”。"}, {"d": "综测", "p": 1, "q": "作文自评清单（写完对一遍）？", "a": "①审题：对象、范围、字数都对吗？②结构：总论点统率分论点，分论点句式整齐吗？③素材：有具体例子/数据吗？④开头结尾有没有回扣主题？⑤卷面、时间是否达标（大作文限时60分钟）？"}, {"d": "职测", "p": 1, "q": "资料分析：基期量和增长量公式？", "a": "基期量＝现期量÷(1＋增长率)；增长量＝现期量－基期量＝现期量×增长率÷(1＋增长率)。"}, {"d": "职测", "p": 1, "q": "资料分析：比重、平均数、倍数？", "a": "比重＝部分÷整体；平均数＝总量÷份数；A是B的几倍＝A÷B。"}, {"d": "职测", "q": "比重上升还是下降怎么判断？", "a": "部分增速＞整体增速→比重上升；部分增速＜整体增速→比重下降。"}, {"d": "职测", "q": "间隔增长率、混合增长率的结论？", "a": "间隔增长率r＝r₁＋r₂＋r₁×r₂；混合增长率一定介于各部分增长率之间，且偏向基期量大的一方。"}, {"d": "职测", "p": 1, "q": "资料分析必背百化分（记6个）？", "a": "1/6≈16.7%、1/7≈14.3%、1/8＝12.5%、1/9≈11.1%、1/11≈9.1%、1/12≈8.3%。"}, {"d": "职测", "q": "截位直除怎么用？", "a": "先看选项差距：差距大分母截两位、差距小截三位，分子一般不动，快速估商定位答案。"}, {"d": "职测", "p": 1, "q": "工程问题怎么做？", "a": "核心：总量＝效率×时间。常用赋值法：赋值总量为各时间的最小公倍数，或赋值效率为1。"}, {"d": "职测", "p": 1, "q": "行程问题核心公式？", "a": "相遇：路程和＝速度和×时间；追及：路程差＝速度差×时间；流水：顺水速度＝船速＋水速。"}, {"d": "职测", "q": "经济利润问题公式？", "a": "利润＝售价－成本；利润率＝利润÷成本；打x折即原价×x/10。"}, {"d": "职测", "q": "浓度问题怎么算？", "a": "溶质＝溶液×浓度；两种溶液混合用十字交叉法求比例。"}, {"d": "职测", "p": 1, "q": "排列组合的加法原理和乘法原理？", "a": "分类用加法、分步用乘法；A(n,m)有顺序、C(n,m)无顺序。"}, {"d": "职测", "q": "两集合容斥公式？", "a": "A∪B＝A＋B－A∩B；总数＝A＋B－A∩B＋非A非B。"}, {"d": "职测", "q": "牛吃草问题公式？", "a": "原有草量＝（牛数－每天新长草量）×天数；抓住“原有草量不变”列方程。"}, {"d": "职测", "q": "等差数列常用公式？", "a": "和＝(首项＋末项)×项数÷2；项数＝(末项－首项)÷公差＋1；中位数×项数＝总和。"}, {"d": "职测", "q": "数量关系四大快解技巧？", "a": "代入排除法、赋值法、比例法、整除（奇偶）特性法——先看选项特征再决定用哪个。"}, {"d": "法理", "p": 1, "q": "法最显著的特征？", "a": "法是靠国家强制力保证实施的， 具有国家强制性", "src": "fb450", "no": 1}, {"d": "法理", "p": 1, "q": "法的规范作用？", "a": "指引自己、评价他人、教育一般人、预测相互间、强制违法者", "src": "fb450", "no": 2}, {"d": "法理", "p": 1, "q": "习惯、判例、政策、学理等属于？", "a": "法的非正式渊源", "src": "fb450", "no": 3}, {"d": "宪法", "p": 1, "q": "填空：修宪____；释宪____；督宪权____", "a": "修宪权全人大；释宪权全人常；督宪权全人大及全人常", "src": "fb450", "no": 4}, {"d": "宪法", "p": 1, "q": "法律的制定主体是什么？", "a": "全国人大及其常委会", "src": "fb450", "no": 5}, {"d": "宪法", "p": 1, "q": "全国人大有权制定基本法律；____", "a": "全国人大常委会有权制定非基本法律", "src": "fb450", "no": 6}, {"d": "行政法", "p": 1, "q": "行政法规的制定主体是什么？", "a": "国务院", "src": "fb450", "no": 7}, {"d": "法理", "p": 1, "q": "地方性法规的制定主体是什么？", "a": "省、自治区、直辖市人大及其常委会；设区的市、自治州的人大及其常委会", "src": "fb450", "no": 8}, {"d": "法理", "p": 1, "q": "同位阶法的效力:特别法 > 一般法、新法 > 旧法、____", "a": " 实体法>程序法", "src": "fb450", "no": 9}, {"d": "法理", "p": 1, "q": "空间效力上？", "a": "我国属地主义为主，与属人、保护主义相结合", "src": "fb450", "no": 10}, {"d": "宪法", "p": 1, "q": "权利和义务之间是什么？", "a": "对立统一的，没有无义务的权利，也没有无权利的义务", "src": "fb450", "no": 11}, {"d": "法理", "p": 1, "q": "法律关系的客体包括？", "a": "物、人身利益、精神财富和行为", "src": "fb450", "no": 12}, {"d": "法理", "p": 1, "q": "引起法律关系变动的原因是法律事实；法律事实分为？", "a": "法律行为和法律事件", "src": "fb450", "no": 13}, {"d": "宪法", "p": 1, "q": "宪法是国家根本法，表现为？", "a": "内容最根本、法律效力最高、制修程序最严", "src": "fb450", "no": 14}, {"d": "宪法", "p": 1, "q": "宪法效力最高？", "a": "派生普通法律、任何法不得与其相违背、是最高行为准则", "src": "fb450", "no": 15}, {"d": "宪法", "p": 1, "q": "宪法最主要、最核心价值它是什么？", "a": "公民权利的保障书", "src": "fb450", "no": 16}, {"d": "宪法", "p": 1, "q": "现行宪法于 1988年、1993年、1999年、____", "a": "2004年和 2018年进行了5次修改", "src": "fb450", "no": 17}, {"d": "宪法", "p": 1, "q": "补全考点（宪法修正案由全国……）：", "a": "宪法修正案由全国人大以全体代表的三分之二以 辨认自己行为的成年人）能够独立从事（有效）纯获利益、____", "a": "与其能力相适应的行为", "src": "fb450", "no": 95}, {"d": "民法", "p": 1, "q": "补全考点（“完人”（已满 ……）：", "a": "“完人”（已满 18周岁；16周岁以上不满 18周岁以自己的劳动收入为主要生活来源的）能够独立实施民事法律行为", "src": "fb450", "no": 96}, {"d": "法理", "p": 1, "q": "未成年人的监护人是父母？", "a": "父母死亡或没能力：有监护能力的祖父母、外祖父母—兄姐―其他经居委会、村委会同意的个人或组织按顺序监护", "src": "fb450", "no": 97}, {"d": "行政法", "p": 1, "q": "民事法律行为有效的条件？", "a": "主体合格，意思表示真实，不违反法律、行政法规及公序良俗", "src": "fb450", "no": 98}, {"d": "民法", "p": 1, "q": "效力待定的民事法律行为？", "a": "“限人”超越其能力范围的行为、无权代理行为", "src": "fb450", "no": 99}, {"d": "民法", "p": 1, "q": "可撤销的民事法律行为？", "a": "重大误解、欺诈、胁迫、显失公平", "src": "fb450", "no": 100}, {"d": "民法", "p": 1, "q": "无效的民事法律行为？", "a": "“无人“所为；虚假表示；违反法律和公序良俗；恶意串通", "src": "fb450", "no": 101}, {"d": "民法", "p": 1, "q": "物权变动？", "a": "不动产看登记；动产看交付", "src": "fb450", "no": 102}, {"d": "民法", "p": 1, "q": "没有处分权，但受让人善意且支付合理的对价，动产已交付不动产已登记的，受让人取得所有权？", "a": "原所有权人只能向无处分权人请求赔偿损失。（善意取得）", "src": "fb450", "no": 103}, {"d": "民法", "p": 1, "q": "遗失物？", "a": "不适用善意取得。自发布招领公告之日起一年内无人认领，归国家", "src": "fb450", "no": 104}, {"d": "民法", "p": 1, "q": "用益物权包括？", "a": "建设用地使用权、土地承包经营权、宅基地使用权、地役权、居住权", "src": "fb450", "no": 105}, {"d": "民法", "p": 1, "q": "居住权？", "a": "自登记设立，不得转让、继承，除非另有约定不得出租", "src": "fb450", "no": 106}, {"d": "法理", "p": 1, "q": "住宅建设用地使用权期间届满的，____", "a": "自动续期", "src": "fb450", "no": 107}, {"d": "民法", "p": 1, "q": "担保物权包括？", "a": "抵押权、质权、留置权", "src": "fb450", "no": 108}, {"d": "民法", "p": 1, "q": "不能抵押？", "a": "土地所有权+一般的集体土地使用权+非营利法人的公益设施+所有权使用权不明或者有争议的财产+被查封、扣押、监管的财产", "src": "fb450", "no": 109}, {"d": "民法", "p": 1, "q": "债的发生原因主要有:合同、侵权行为、无因管理、____", "a": "不当得利", "src": "fb450", "no": 110}, {"d": "宪法", "p": 1, "q": "无因管理成立条件？", "a": "（1）没有法定或约定的义务；（2 ）主观有为他人谋利益的意思；（3）客观为他人管理事务", "src": "fb450", "no": 111}, {"d": "法理", "p": 1, "q": "无因管理的法律后果？", "a": "偿还必要费用；遭受的损失可要求适当补偿", "src": "fb450", "no": 112}, {"d": "法理", "p": 1, "q": "不当得利的成立条件？", "a": "（1）一方获得利益；（2）他方受到损失；（3）获得利益和受到损失之间有因果关系；（4）获得利益没有合法根据", "src": "fb450", "no": 113}, {"d": "法理", "p": 1, "q": "不当得利的法律后果？", "a": "返还不当得利。得利人善意：返还现存利益；恶意：返还得利+赔偿损失", "src": "fb450", "no": 114}, {"d": "民法", "p": 1, "q": "婚姻无效？", "a": "（1） 重婚；（2）有禁止结婚的亲属关系；（3）未到法定婚龄", "src": "fb450", "no": 115}, {"d": "民法", "p": 1, "q": "可撤销婚姻？", "a": "受胁迫结婚的、重大疾病未告知的。一年内申请", "src": "fb450", "no": 116}, {"d": "民法", "p": 1, "q": "夫妻共同财产？", "a": "工资、奖金、劳务报酬，生产、 经营、投资收益，知识产权收益，因继承或赠与所得财产（遗嘱、赠与合同中确定只归一方的除外）", "src": "fb450", "no": 117}, {"d": "民法", "p": 1, "q": "夫妻一方个人财产？", "a": "专用生活用品、婚前财产、人身损害赔偿或补偿、遗嘱或者赠与合同中确定只归一方的财产", "src": "fb450", "no": 118}, {"d": "民法", "p": 1, "q": "第一顺位法定继承人？", "a": "配偶、子女、父母（含尽了主要赡养义务的丧偶儿媳、女婿）;第二顺位法定继承人：兄弟姐妹、祖父母、外祖父母", "src": "fb450", "no": 119}, {"d": "民法", "p": 1, "q": "法定遗嘱的形式包括？", "a": "公证遗嘱、自书遗嘱、代书遗嘱、录音录像遗嘱、口头遗嘱、打印遗嘱管理学：", "src": "fb450", "no": 120}, {"d": "管理", "p": 1, "q": "管理的四个基本职能？", "a": "计划、组织、领导、控制", "src": "fb450", "no": 121}, {"d": "管理", "p": 1, "q": "计划是什么？", "a": "管理的首要职能", "src": "fb450", "no": 122}, {"d": "管理", "p": 1, "q": "管理者应具备的技能？", "a": "技术技能、人际技能、概念技能（观念技能）", "src": "fb450", "no": 123}, {"d": "管理", "p": 1, "q": "越是处于高层的管理人员，____", "a": "越需要更多地掌握概念技能", "src": "fb450", "no": 124}, {"d": "管理", "p": 1, "q": "越是处于基层管理人员，____", "a": "越需要更多地掌握技术技能", "src": "fb450", "no": 125}, {"d": "管理", "p": 1, "q": "补全考点（泰勒被管理界誉为……）：", "a": "泰勒被管理界誉为“科学管理之父”", "src": "fb450", "no": 126}, {"d": "管理", "p": 1, "q": "非程序化决策是什么？", "a": "对较少出现、不确定的、关系大的新问题的决策", "src": "fb450", "no": 127}, {"d": "管理", "p": 1, "q": "风险型决策指决策者无法确定发生哪种自然状态，____", "a": "但知道有多少种自然状态以及每种自然状态发生的概率", "src": "fb450", "no": 128}, {"d": "管理", "p": 1, "q": "管理层次是什么？", "a": "指组织内部从最高一级管理到最低一级管理组织的组织等级", "src": "fb450", "no": 129}, {"d": "管理", "p": 1, "q": "管理幅度是什么？", "a": "指一名管理者直接管理或控制的下级人数", "src": "fb450", "no": 130}, {"d": "管理", "p": 1, "q": "当组织规模一定时，____", "a": "管理幅度与管理层次之间存在反比关系", "src": "fb450", "no": 131}, {"d": "管理", "p": 1, "q": "社会人假设认为人的行为动机不只是为了追求经济利益，还包括？", "a": "人的社会需要", "src": "fb450", "no": 132}, {"d": "管理", "p": 1, "q": "马斯洛将人的需要从低到高归纳为五个层次？", "a": "生理需要、安全需要、社交需要、 "承担行政职能的事业单位、从事生产经营活动的事业单位以及从事公益服务的事业单位", "src": "fb450", "no": 437}, {"d": "道德", "p": 1, "q": "事业单位按经费来源不同分为？", "a": "全额预算、差额预算以及自收自支预算管理单位", "src": "fb450", "no": 438}, {"d": "道德", "p": 1, "q": "事业单位岗位分管理岗位、____", "a": "专业技术岗位和工勤技能岗位", "src": "fb450", "no": 439}, {"d": "道德", "p": 1, "q": "事业单位与工作人员订立的聘用合同，____", "a": "期限一般不低于 3年", "src": "fb450", "no": 440}, {"d": "道德", "p": 1, "q": "初次就业工作人员与事业单位订立聘用合同期限 3年以上的，____", "a": "试用期为 12个月", "src": "fb450", "no": 441}, {"d": "道德", "p": 1, "q": "事业单位工作人员受到开除处分的，____", "a": "解除聘用合同", "src": "fb450", "no": 442}, {"d": "道德", "p": 1, "q": "旷工连续超过 15个工作日或者一年内累计超过 30个工作日，____", "a": "可解除聘用合同", "src": "fb450", "no": 443}, {"d": "道德", "p": 1, "q": "事业单位工作人员年度考核不合格且不同意调整工作岗位，或者连续两年年度考核不合格的，事业单位提前 30日书面通知，____", "a": "可以解除聘用合同", "src": "fb450", "no": 444}, {"d": "道德", "p": 1, "q": "事业单位工作人员考核德、能、勤、绩、廉五个方面，____", "a": "重点考核工作实绩", "src": "fb450", "no": 445}, {"d": "道德", "p": 1, "q": "年度考核结果分为？", "a": "优秀、合格、基本合格和不合格 4个等次", "src": "fb450", "no": 446}, {"d": "道德", "p": 1, "q": "事业单位工作人员工资包括？", "a": "基本工资、绩效工资和津贴补贴", "src": "fb450", "no": 447}, {"d": "道德", "p": 1, "q": "事业单位嘉奖的种类包括？", "a": "嘉奖、记功、记大功、授予荣誉称号", "src": "fb450", "no": 448}, {"d": "道德", "p": 1, "q": "事业单位处分的种类包括？", "a": "警告、记过、降低岗位等级或者撤职、开除", "src": "fb450", "no": 449}, {"d": "道德", "p": 1, "q": "人事争议处理渠道主要包括？", "a": "协商、调解、仲裁、诉讼（对仲裁裁决不服）", "src": "fb450", "no": 450}, {"d": "中特", "p": 1, "q": "【10·14模考】中华民族共同体形成和发展的历史根基是什么？", "a": "各民族【血脉相融】。常考陷阱：把\"文化相通\"说成\"历史根基\"（文化相通是精神纽带）。配套记忆：血脉相融（历史根基）、信念相同（政治基础）、文化相通（精神纽带）、经济相依（物质基础）、情感相亲（情感基础）。", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】新时代党的建设总要求中，党的政治建设是什么定位？", "a": "以党的政治建设为【统领】；以坚定理想信念宗旨为【根基】；以调动全党积极性、主动性、创造性为【着力点】。（陷阱：\"政治建设为根基\"错）", "src": "mock1014"}, {"d": "民法", "p": 1, "q": "【10·14模考】把房屋租给别人使用，转让的是什么权利？（租赁vs居住权）", "a": "转让的是【租赁权】（合同债权/使用权益），不是居住权。居住权是民法典新设的【用益物权】：书面合同+登记才设立，不得转让、继承，原则上无偿，居住权人死亡消灭。", "src": "mock1014"}, {"d": "民法", "p": 1, "q": "【10·14模考】广告牌等悬挂物脱落砸伤他人，由谁承担责任？", "a": "【所有人、管理人或者使用人】：不能证明自己没有过错的，应当承担侵权责任（过错推定）。⚠️本题官方答案请对照事考帮解析核对，如有出入在App里点编辑修正。", "src": "mock1014"}, {"d": "管理", "p": 1, "q": "【10·14模考】管理过程中的首要职能（起点）是哪个？", "a": "【计划】职能。组织、领导、控制都围绕计划展开。（陷阱：把\"组织职能\"说成首要职能）", "src": "mock1014"}, {"d": "管理", "p": 1, "q": "【10·14模考】行政监督要求\"保持连续性、稳定性，不能时断时续\"，是哪条原则？", "a": "【经常性】原则。（陷阱：把经常性的要求安到\"合法性原则\"头上——合法性指监督必须依法进行）", "src": "mock1014"}, {"d": "公文", "p": 1, "q": "【10·14模考】乡镇政府申请资金的请示，可以同时主送市财政局和市政府吗？", "a": "不能。请示应【主送一个】上级机关，不得多头主送、不得越级行文。", "src": "mock1014"}, {"d": "公文", "p": 1, "q": "【10·14模考】什么机关之间可以联合行文？", "a": "必须是【同级（或相当级别）】机关或部门之间。\"所有党政机关之间都可以根据需要联合行文\"是错的——不是任意组合。", "src": "mock1014"}, {"d": "时政", "p": 1, "q": "【10·14模考】2026年亚运会（第20届）在哪举办？这是日本第几次办亚运？", "a": "2026年9月19日在日本【爱知县·名古屋】开幕；日本是【第三次】举办亚运会（前两次：1958年东京、1994年广岛）。", "src": "mock1014"}, {"d": "时政", "p": 1, "q": "【10·14模考】\"文化和旅游部印发《文化和旅游发展'十五五'规划》\"这句对不对？", "a": "⚠️存疑卡：请对照事考帮解析确认官方表述（发布主体/文件名称/关键表述是否被替换）。核对后点编辑修正此卡。常考陷阱：发布主体错（应为国务院/中办国办）、名称错、表述细节错。", "src": "mock1014"}, {"d": "科技", "p": 1, "q": "【10·14模考】MR（混合现实）是什么技术？", "a": "融合【VR（虚拟现实）+AR（增强现实）】的技术，可实现虚拟内容与现实场景的深度交互融合。（判断题此说法为\"对\"）", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】\"不能等实现了现代化再来解决共同富裕\"体现了什么？", "a": "⚠️请核对解析。提示：题干\"不能等\"\"逐步解决\"→指向共同富裕是【长期历史过程】，要保持历史耐心；\"出发点和落脚点\"→以人民为中心。两个选项都沾边时，抓题干最强调的那句。", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】关于建设社会主义文化强国，哪句表述有误？", "a": "\"社会主义先进文化是中华民族的生命血脉、精神命脉\"——错。正确的是：【中华优秀传统文化】是中华民族的根和魂，是涵养社会主义核心价值观的重要源泉。", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】中国特色社会主义相关：哪些表述正确？", "a": "⚠️请核对解析确认官方答案。确定无误的两点：①\"中国特色社会主义是改革开放以来党的全部理论和实践的主题\"✓；②\"党的十九大作出中国特色社会主义进入新时代的重大政治论断\"✓。注意句尾硬挂\"核心要义\"一类的拼凑陷阱。", "src": "mock1014"}, {"d": "党史", "p": 1, "q": "【10·14模考】民族精神/时代精神的核心分别是什么？党的最高理想是什么？", "a": "以【爱国主义】为核心的民族精神；以【改革创新】为核心的时代精神（两者最爱互换）。党的最高理想和最终目标是【实现共产主义】（不是民族复兴）；党百年奋斗的主题才是中华民族伟大复兴。", "src": "mock1014"}, {"d": "刑法", "p": 1, "q": "【10·14模考】盗窃被发现后持刀拒捕，对方反击致其死亡，如何定性？", "a": "盗窃→当场使用暴力抗拒抓捕→【转化为抢劫】；对正在进行行凶、抢劫等严重危及人身安全的暴力犯罪可【特殊防卫】，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任。", "src": "mock1014"}, {"d": "刑法", "p": 1, "q": "【10·14模考】不作为犯罪的义务来源有哪些？", "a": "【法律明文规定、职务或业务要求、法律行为（合同等）、先行行为】引起的义务。判断：带未成年人泳者/先行行为人有救助义务（构成不作为犯罪）；路人无救助义务；情侣分手后一方自杀，另一方不构成不作为犯罪。", "src": "mock1014"}, {"d": "刑法", "p": 1, "q": "【10·14模考】被抓后主动交代司法机关未掌握的其他罪行算什么？交代同案犯基本信息算立功吗？", "a": "交代司法机关未掌握的【不同种】罪行→就以该罪成立【自首】（余罪自首）；如实供述同案犯基本信息属于坦白，【不构成立功】（只有检举他人犯罪查证属实、协助抓捕等才是立功）。", "src": "mock1014"}, {"d": "行政法", "p": 1, "q": "【10·14模考】对市政府工作部门（如城管局）的行为不服，向谁申请行政复议？", "a": "向【本级人民政府】申请。这是2023年新《行政复议法》的重大变化：原则上不再向上一级主管部门申请（垂直领导部门如海关、金融、外汇等除外）。另：复议机关收到申请后【5日内】审查决定是否受理。", "src": "mock1014"}, {"d": "民法", "p": 1, "q": "【10·14模考】员工离职后，拿着未收回的授权委托书以公司名义签约，合同有效吗？", "a": "构成【表见代理】：相对人有理由相信行为人有代理权的，该代理行为【有效】，由公司承担合同责任。", "src": "mock1014"}, {"d": "民法", "p": 1, "q": "【10·14模考】居住权能转让、继承吗？怎么设立？", "a": "居住权【不得转让、继承】，居住权人死亡的，居住权消灭；须以【书面合同+登记】设立（不登记不设立）；原则上无偿。房屋所有权转移不影响已登记的居住权。", "src": "mock1014"}, {"d": "经济", "p": 1, "q": "【10·14模考】政府通过粮食储备吞吐来平抑粮价，属于什么手段？", "a": "属于经济手段的【间接调控】（库存吞吐调节供求）。把它说成\"行政命令直接干预市场价格\"是错误的。", "src": "mock1014"}, {"d": "科技", "p": 1, "q": "【10·14模考】盐放入白开水后变咸，说明什么？哪些现象不算分子无规则运动？", "a": "变咸=【扩散】现象（分子无规则运动）。\"房间积灰、水往低处流\"属于机械运动；\"铁器生锈\"属于化学变化。", "src": "mock1014"}, {"d": "人文", "p": 1, "q": "【10·14模考】佛教什么时候传入中国？道教在哪里创立？", "a": "佛教在【两汉之际】（西汉末年至东汉初年）经丝绸之路传入，\"西汉初年\"是错误表述；道教：东汉【张陵在四川鹤鸣山】创立五斗米道，被视为道教雏形。禅宗是佛教中国化最典型代表。", "src": "mock1014"}, {"d": "公文", "p": 1, "q": "【10·14模考】公文按内容性质划分为哪几类？\"议案\"属于哪一类？", "a": "公布性、呈报（报请）性、领导指导性、商洽性、知照性、记录性等。《国务院关于提请审议……的议案》属于【呈报性公文】。", "src": "mock1014"}, {"d": "公文", "p": 1, "q": "【10·14模考】\"意见\"的三种类型分别怎么用？", "a": "意见可上行、下行、平行文。【建议性意见】：向上级献计献策；【指导性意见】：领导机关布置工作的下行文（不是\"评估性意见\"）；【评估性意见】：对某事项评估后提供参考。", "src": "mock1014"}, {"d": "科技", "p": 1, "q": "【10·14模考】5G速率高是因为毫米波穿透力强吗？", "a": "错。毫米波属于【高频段】：带宽大、速率高，但【穿透力弱、覆盖范围小】，需要密集建站。", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】党的\"四力\"标准表述是什么？", "a": "【政治领导力、思想引领力、群众组织力、社会号召力】。（陷阱：\"思想判断力\"是错误替换）", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】火车过桥：桥长1000米，从开始上桥到完全下桥用120秒，完全在桥上80秒，求车速。", "a": "桥长+车长=120v；桥长-车长=80v。两式相加：2000=200v → v=10米/秒=【600米/分】。", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】前半程速度4米/秒、后半程6米/秒，全程平均速度是多少？", "a": "等距离平均速度=2v₁v₂/(v₁+v₂)=2×4×6÷10=【4.8米/秒】。（陷阱：不能直接用(4+6)÷2=5）", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】某月有五个星期六，日期之和为75，最后一个星期六是几号？", "a": "五个星期六等差排列：第3个=75÷5=15号 → 5个日期为1、8、15、22、【29】号。", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】资料分析：怎样快速找\"增长最多\"的年份？", "a": "增长量=现期-基期：柱状图上直接看相邻两根柱子的【高度差】，差最大者增长最多（不要去算增长率）。", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】资料分析：\"增长率首次出现下滑\"怎么判断？", "a": "增长率下滑=今年增速比去年【变小】。逐年用\"增量÷基期\"口算比较，或看相邻年份的倍数变化（倍数变小即增速下滑）。", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】资料分析：\"增幅超过30%的年份有几个\"怎么快速数？", "a": "增幅>30% ⇔ 现期>基期×1.3。把\"基期×1.3\"当基准线逐年口算比大小，不要逐个精算。", "src": "mock1014"}, {"d": "职测", "p": 1, "q": "【10·14模考】资料分析：\"平均数量超过某年数量\"这类判断怎么做？", "a": "平均数与目标值比较可【交叉相乘】口算：平均数>X ⇔ 总量 > X×年份数。", "src": "mock1014"}, {"d": "中特", "p": 1, "q": "【10·14模考】总体国家安全观：政治安全的核心是什么？哪种表述必错？", "a": "政治安全的核心是【政权安全、制度安全】，最根本的是维护党的领导和执政地位；\"加强党对国家安全工作的绝对领导是新时代中国国家安全的根本保证\"✓。凡出现\"确保零风险\"\"绝对不发生\"等【绝对化】表述→必错。⚠️本题完整答案请核对解析。", "src": "mock1014"}, {"d": "时政", "p": 1, "q": "【10·14模考】\"十五五\"规划建议在国土空间发展格局上的要求？", "a": "①保持城市化地区、农产品主产区、重点生态功能区格局【总体稳定】✓；②赋予省级政府统筹建设用地更大自主权、统筹存量和增量综合供地✓；③\"战略性产业向东部集中\"✗、\"取消城镇开发边界\"✗（要严守开发边界、优化重大生产力布局）。", "src": "mock1014"}, {"d": "刑法", "p": 1, "q": "【10·14模考】交通肇事罪要点：构罪标准、逃逸、指使逃逸、带离遗弃？", "a": "①致1人死亡且负全部或主要责任→构成交通肇事罪；②\"因逃逸致人死亡\"是交通肇事罪的【加重情节】；③单位主管人员等【指使】肇事人逃逸致人死亡的→以交肇罪【共犯】论处；④事后将被害人带离现场隐藏、遗弃致死→以【故意杀人罪】定罪。⚠️本题完整选项请核对解析。", "src": "mock1014"}, {"d": "民法", "p": 1, "q": "【10·14模考】婚前个人财产婚后增值算共同财产吗？夫妻共同债务怎么认定？", "a": "①婚前个人财产因市场行情变化的【自然增值】仍属个人财产；②遗嘱中明确只归一方所有的财产=个人财产；③以个人名义负债但【用于家庭共同生活】=共同债务；④赌博挥霍等个人用途【不属】共同债务。", "src": "mock1014"}, {"d": "经济", "p": 1, "q": "【10·14模考】扩张性（积极）财政政策的工具有哪些？（与货币政策区分）", "a": "财政政策：增加政府购买支出✓、减税降费✓、增加转移支付、增发国债。货币政策（不对称）：降低存款准备金率✗、公开市场买入国债✗。", "src": "mock1014"}, {"d": "公文", "p": 1, "q": "公文中的“附注”标注在什么位置？", "a": "成文日期之后，居左空二字加圆括号标注（常用于说明印发传达范围、联系人及电话等；上行文应当标注联系人姓名和电话）。"}, {"d": "刑法", "p": 1, "q": "犯罪构成的四个要件是什么？", "a": "犯罪主体、犯罪客体、犯罪主观方面、犯罪客观方面（传统四要件说）。"}, {"d": "马哲", "p": 1, "q": "辩证否定的实质“扬弃”是什么含义？", "a": "既克服又保留：克服旧事物中过时的、消极的内容，保留其积极合理的因素。"}, {"d": "职测", "p": 1, "q": "等比数列求和公式？", "a": "Sn=a₁(1-qⁿ)/(1-q)（q≠1）；当q=1时Sn=na₁。"}, {"d": "中特", "p": 1, "q": "填空：第一篇《习近平新时代中国特色社会主义思想》第一章总论知识点1 习近平新时代中国特色社会主义思想的核心要义____，是改革开放以来我们党全部理论和实践的鲜明主题，也是习近平新时代中国特色社会主义思想的核心要义。", "a": "坚持和发展中国特色社会主义", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：年召开的中共____，邓小平提出：“走自己的道路，建设有中国特色的社会主义。", "a": "十二大", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：党的____以来，以习近平同志为核心的党中央领导全党全国各族人民开创了中国特色社会主义新时代，实现了具有里程碑意义的伟大变革。", "a": "十八大", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：党的____作出中国特色社会主义进入新时代这个重大政治论断。", "a": "十九大", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：____是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。", "a": "文化自信", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：新时代是决胜全面____、进而全面____的时代。", "a": "建成小康社会；建设社会主义现代化强国", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：新时代是全国各族人民不断创造美好生活、逐步实现全体人民____的时代。", "a": "共同富裕", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：中国特色社会主义进入新时代的依据（1）中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映我国社会主要矛盾的变化是我们党作出中国特色社会主义进入新时代重大判断的____。", "a": "基本依据", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：党的十九大报告指出，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和____的发展之间的矛盾。", "a": "不平衡不充分", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：我国仍处于并将长期处于____的基本国情没有变，我国是世界____的国际地位没有变。", "a": "社会主义初级阶段；最大发展中国家", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：中国特色社会主义进入新时代，是党的主要任务发生新变化的反映党的十八大后，党面临的主要任务是，实现____目标，开启实现第二个百年奋斗目标新征程。", "a": "第一个百年奋斗", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“两个结合”是指要把马克思主义基本原理同____相结合、同____相结合。", "a": "同中国具体实际；中华优秀传统文化", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：习近平总书记在强调坚持“第一个结合”的基础上，明确提出把马克思主义基本原理同____相结合的重大命题，这是又一次的思想解放。", "a": "中华优秀传统文化", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：习近平新时代中国特色社会主义思想坚持把马克思主义基本原理同中国具体实际相结合，用____之“矢”去射____之“的”。", "a": "马克思主义；新时代中国", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：习近平新时代中国特色社会主义思想使____ 这个魂脉和____这个根脉内在贯通、相互成就，是中华民族文化主体性最有力的体现，是中华文化和中国精神的时代精华。", "a": "马克思主义；中华优秀传统文化", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：“两个结合”是对坚持和发展马克思主义作出的重大理论贡献，是我们取得成功的____。", "a": "最大法宝", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：【知识延伸】“结合”的____是彼此契合。", "a": "前提", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“结合”的____是互相成就。", "a": "结果", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“结合”是深刻的“____反应”，造就了一个有机统一的新的文化生命体。", "a": "化学", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“第二个结合”让中国特色社会主义道路有了更加宏阔深远的历史纵深，拓展了中国特色社会主义道路的____根基。", "a": "文化", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“结合”巩固了文化____。", "a": "主体性", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：党的十九大、十九届六中全会提出的“十个明确”“十四个坚持”“十三个方面成就”概括了习近平新时代中国特色社会主义思想的____。", "a": "主要内容", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：党的二十大提出的“____”，是习近平新时代中国特色社会主义思想的世界观、方法论。", "a": "六个必须坚持", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：“十个明确”“十四个坚持”“十三个方面成就”“六个必须坚持”内在贯通、有机统一，共同构成了习近平新时代中国特色社会主义思想的____。", "a": "科学体系", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：十个明确“十个明确”是习近平新时代中国特色社会主义思想的____，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着____作用。", "a": "主体内容；统摄", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：明确中国特色社会主义最本质的特征是____，中国特色社会主义制度的____是中国共产党领导，中国共产党是最高政治领导力量，全党必须增强“四个意识”、坚定“四个自信”、做到“两个维护”。", "a": "中国共产党领导；最大优势", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：明确坚持和发展中国特色社会主义，总任务是实现____和____，在全面建成小康社会的基础上，分两步走在____建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。", "a": "社会主义现代化；中华民族伟大复兴；本世纪中叶", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：明确新时代我国社会主要矛盾是人民日益增长的____需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。", "a": "美好生活", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：明确中国特色社会主义事业____是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，____是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党四个全面。", "a": "总体布局；战略布局", "src": "pdf1016"}, {"d": "中特", "p": 2, "q": "填空：明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家____现代化。", "a": "治理体系和治理能力", "src": "pdf1016"}, {"d": "中特", "p": 1, "q": "填空：明确必须坚持和完善社会 的结果，其中____是主导。", "a": "人为因素", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：硅（Si）硅是一种半导体材料，常用于制造半导体器件、太阳能电池板和____。", "a": "集成电路", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：二氧化硅（SiO2）：____等岩石的重要成分。", "a": "花岗岩", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：知识点2 金属物质1.钛（Ti）钛由于其稳定的化学性质，良好的耐高温、耐低温、抗强酸、抗强碱，以及高强度、低密度的特性，被誉为“____”。", "a": "太空金属", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：钛合金可用于____，也可用于制造飞机、火箭的结构件。", "a": "人造骨骼", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：铁（Fe）铁是日常生活中应用____的金属。", "a": "最广泛", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：根据____的不同，铁合金主要分为生铁和钢两类。", "a": "含碳量", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：钢的含碳量为0.02%至2.11%，具有良好的延展性、韧性和机械性能，广泛用于建筑、机械、交通、日用品等几乎所有领域，是____、用途最广的合金。", "a": "用量最大", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：不锈钢多指含____（Cr）量在12%-30%的合金钢。", "a": "铬", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：铜（Cu）纯铜呈紫红色，俗称紫铜或红铜，有极好的导热、导电性，是人类____的金属。", "a": "最早使用", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：黄铜以____为主要添加元素，是____的铜合金。", "a": "锌；最常见", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：青铜以锡或铝等为添加元素，是____的合金。", "a": "最早出现", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：钙（Ca）钙是人体内含量最多的____元素。", "a": "金属", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：汞（Hg）汞，俗称水银，是常温常压下唯一呈现____的金属，是熔点最低的金属。", "a": "液态", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：pH值____7 时显酸性，pH值越小则酸性越强；", "a": "小于", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：pH值____7 时显碱性，pH值越大则碱性越强。", "a": "大于", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：酸盐酸（HCl）：____的主要成分。", "a": "胃酸", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：热的浓硫酸具有很强的氧化性和____。", "a": "脱水性", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：碱氢氧化钠（NaOH）：俗称火碱、烧碱、____。", "a": "苛性钠", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：氢氧化钙（Ca(OH)2）：俗称____、消石灰。", "a": "熟石灰", "src": "pdf1016_common"}, {"d": "科技", "p": 2, 2 生物代谢1.新陈代谢新陈代谢是生物区别于非生物____的特征，包括同化作用（合成代谢）和异化作用（分解代谢）。", "a": "最本质", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：如：____作用。", "a": "光合", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：光合作用含义：植物、藻类和某些细菌，在可见光的照射下，经过光反应和暗反应，利用光合色素，将____（或硫化氢）和水转化为有机物，并释放出____（或氢气）的生化过程。", "a": "二氧化碳；氧气", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：影响因素：____（强度、时间）、____浓度、温度、水分。", "a": "光照；二氧化碳", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：产物为水和____。", "a": "二氧化碳", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：①产物为____：乳酸菌、动物、部分植物（马铃薯块茎、玉米胚、甜菜块根等）。", "a": "乳酸", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：②产物为____和二氧化碳：酵母菌、绝大多数植物。", "a": "酒精", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：影响因素：____、温度、湿度、风。", "a": "光照", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：消化道包括口腔、咽、食道、胃、____（包括十二指肠、空肠、回肠）、大肠（包括盲肠、阑尾、结肠、直肠）、肛门等。", "a": "小肠", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：消化腺是分泌消化液的腺体，包括唾液腺、胰腺、____、胃腺和肠腺等。", "a": "肝脏", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：____钙化程度最高，是人体最硬的组织。", "a": "牙釉质", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：____：食物消化吸收的最主要场所，人体最长的器官（全长4-6 米）。", "a": "小肠", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：肝脏：人体最大的____、最大的____、最大的内脏器官。", "a": "消化腺；解毒器官", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：终点：____，被胰液、肠液彻底分解为____。", "a": "小肠；葡萄糖", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：蛋白质起点：____，被胃蛋白酶初步分解为多肽。", "a": "胃", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：终点：小肠，被胰液、肠液彻底分解为____。", "a": "氨基酸", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：脂肪起点：____，脂肪是唯一只在____消化的物质。", "a": "小肠；小肠", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：【知识延伸】非条件反射和条件反射非条件反射：生来就有的____反射，是一种比较____的神经活动，由大脑皮层以下的神经中枢（如脑干、脊髓）参与即可完成。", "a": "先天性；低级", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：如____反射、眨眼反射、缩手反射、婴儿的吮乳、排尿反射等。", "a": "膝跳", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：条件反射：在一定条件下，外界刺激与有机体反应之间建立起来的暂时神经联系，____形成。", "a": "后天", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：在大脑皮层参与下完成，是一种____的神经活动。", "a": "高级", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：常见激素的名称及其作用如下：（1）胰岛素：由胰腺内胰岛β细胞分泌，在调节人体血糖水平方面起着至关重要的作用，是人体内唯一降低____的激素。", "a": "血糖", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：分泌不足会造成____，分泌过多会引起低血糖。", "a": "糖尿病", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：必须终身依赖____胰岛素治疗。", "a": "外源性", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：甲状腺素：由甲状腺合成和分泌，能促进体内物质和能量代谢，促进身体和智力发育，对骨骼、神经系统和生殖系统有显著影响，其合成需要____。", "a": "碘元素", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：分泌不足会造成____，分泌过多会引起____。", "a": "呆小症；甲亢", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：生长激素：由____分泌，对人体生长发育和物质代谢等具有重要作用。", "a": "腺垂体", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：分泌不足会造成____，分泌过多会引起巨人症、肢端肥大症。", "a": "侏儒症", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：____：由肾上腺分泌，在人体应对紧急情况、调节生理功能方面发挥着“急救兵”般的核心作用。", "a": "肾上腺素", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：其中，____是所有免疫细胞的发源地，____是最大的淋巴器官。", "a": "骨髓；脾脏", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：【知识延伸】免疫细胞1.固有免疫细胞（反应____，但____）吞噬细胞（巨噬细胞、中性粒细胞）：负责“吃掉”病原体。", "a": "迅速；无特异性", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：适应性免疫细胞（反应____，但____且能记忆）T细胞：负责细胞免疫，直接杀伤靶细胞或指挥其他细胞。", "a": "较慢；精准", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：B细胞：负责体液免疫，分化为浆细胞后产生____。", "a": "抗体", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：白细胞总数通常____。", "a": "升高", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：白细胞总数通常正常或____。", "a": "降低", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：③血小板系统（负责凝血和____）血小板计数：数值过低可能导致出血风险增加，过高则可能增加血栓风险。", "a": "止血", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：通常需要在抽血前____8-12 小时，可以少量饮水。", "a": "禁食", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：常见项目如下：①肝功能____：反映肝细胞损伤的敏感指标。", "a": "转氨酶", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：___ ", "p": 2, "q": "填空：第三章高新技术知识点1 计算机技术1.基础知识（1）系统构成①硬件系统运算器：进行运算的部件，计算机中的数值运算采用____。", "a": "二进制", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：控制器：与运算器合称____（CPU）。", "a": "中央处理器", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：【知识延伸】存储器只读存储器（ROM）：只能读出，一般不能写入，断电数据____丢失。", "a": "不会", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：随机存储器（RAM）：可以读出，也可以写入，断电数据____丢失。", "a": "会", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：常见概念①字节字节（Byte）是计算机用于计量存储容量的____。", "a": "基本单位", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：打印——____ 查找——____ 替换——Ctrl+Ｈ2.中国的计算机成就（1）超级计算银河-I（1983 年）：中国首台亿次巨型机，使中国成为继美、日之后第三个能独立设计制造巨型机的国家。", "a": "Ctrl+P；Ctrl+F", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：天河一号（2010 年）：中国首台____超算，首次摘得TOP500 世界第一。", "a": "千万亿次", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：____（2016 年）：实现核心部件完全国产化，多次问鼎世界第一。", "a": "神威·太湖之光", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：量子计算九章一号（2020 年）：首次实现____计算优越性，中国成为全球____实现量子优越性的国家。", "a": "光量子；第二个", "src": "pdf1016_common"}, {"d": "科技", "p": 1, "q": "填空：祖冲之二号（2021 年）：使中国成为唯一在____和____两条路线上都实现“量子优越性”的国家。", "a": "超导；光量子", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：____（2024 年）：中国量子算力首次大规模、长时间向全球开放，昭示我国正式进入量子算力“可用”时代。", "a": "本源悟空", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：知识点2 新能源技术1.能源分类（1）按照技术成熟程度分类传统能源（常规能源）：技术上比较成熟，已被人类广泛利用，如煤、石油、天然气、____等。", "a": "水能", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：新能源（非常规能源）：传统能源之外的各种能源形式，具有污染小、储量大的特点，如太阳能、地热能、风能、海洋能、____（如沼气等）、可燃冰、____等。", "a": "生物质能；核能", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：按照产生方式分类一次能源：自然界中本来就有的各种形式的能源，如____（煤、石油、天然气、可燃冰等）、太阳能、风能、地热能、____、潮汐能等。", "a": "化石能源；核能", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：二次能源：由一次能源经过转化或加工制造而产生的能源，如煤气、沼气、____、汽油、柴油、煤油、酒精、焦炭、蒸汽等。", "a": "电力", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空：按照再生能力分类按照再生能力，可以将____分为可再生能源和不可再生能源。", "a": "一次能源", "src": "pdf1016_common"}, {"d": "科技", "p": 2, "q": "填空  "经济", "p": 2, "q": "填空：【知识延伸】替代品和互补品____是指两种商品之间能够相互替代以满足消费者的某一种需要。", "a": "替代品", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：____是指两种商品必须互相配合，才能共同满足消费者的同一种需要。", "a": "互补品", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：消费者偏好：偏好程度增加，对该商品的需求量增加（____）。", "a": "正比", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：消费者对商品的价格预期：预期商品价格会上涨，对该商品的需求量增加（____）。", "a": "正比", "src": "pdf1016_common"}, {"d": "经济", "p": 1, "q": "填空：知识点2 成本1.机会成本与沉没成本机会成本：为从事某项经营活动而____其他经营活动中获得的____。", "a": "放弃；最大收益", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：沉没成本：已经付出且____的成本。", "a": "不可收回", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：显性成本与隐性成本显性成本：厂商在生产过程中购买或租用他人所拥有的生产要素的____。", "a": "实际支出", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：边际成本：企业每增加一单位产量所引起的总成本的____。", "a": "增量", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：其中____和____合称为内需，____称为外需。", "a": "投资；消费；出口", "src": "pdf1016_common"}, {"d": "经济", "p": 1, "q": "填空：GDP是经济增长核算的核心指标，其概念可从以下几方面理解：①GDP是一国范围内生产的最终产品的市场价值，从而是一个____概念。", "a": "地域", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：②GDP是一定时期内（往往为一年）所____而不是所售卖掉的最终产品价值。", "a": "生产", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：③GDP是计算期内生产的最终产品价值，因而是____而不是存量。", "a": "流量", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：④GDP测度的是当期最终产品的价值，____不计入。", "a": "中间产品", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：⑤GDP是一个市场价值的概念，一般仅指____导致的价值。", "a": "市场活动", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：国民生产总值（GNP）国民生产总值是一个____概念，是指一个国家或一个地区的常住居民在一定时期所拥有的生产要素所生产的全部最终产品（物品和劳务）的市场价值。", "a": "国民", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：知识点4 通货膨胀1.通货膨胀的含义通货膨胀是指在货币流通条件下，因货币供给____货币实际需求，导致货币贬值，而引起的一段时间内商品和劳务的价格持续而普遍地____现象。", "a": "大于；上涨", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：消费价格指数（____）消费价格指数也称居民消费价格指数，是反映与居民生活有关的产品及劳务价格统计出来的物价变动指标。", "a": "CPI", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：按国际惯例，当CPI增幅连续超过____时，就意味着发生了通货膨胀；", "a": "3%", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：生产者价格指数（____）生产者价格指数也称工业生产者出厂价格指数，是衡量工业企业产品出厂价格变动趋势和变动程度的指数，是反映某一时期生产领域价格变动情况的重要经济指标。", "a": "PPI", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：通货膨胀的影响通货膨胀不利于____收入者，有利于____收入者；", "a": "固定；变动", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：通货膨胀不利于____人，有利于____人；", "a": "债权；债务", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：通货膨胀与失业的关系菲利普斯曲线反映了失业率和通货膨胀率之间____变动的关系。", "a": "反向", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：菲利普斯曲线只在____有效，____无效。", "a": "短期；长期", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：知识点5 宏观经济政策1.财政政策和货币政策（1）财政政策和货币政策的内涵财政政策是指____通过变动财政收入和财政支出以保持社会总供给和社会总需求平衡的一种经济政策。", "a": "政府", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：货币政策是指____通过控制和调节货币供应量以保持社会总供给和社会总需求平衡的一种经济政策。", "a": "中央银行", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：主要工具包括法定存款准备金率、____、公开市场业务、____。", "a": "再贴现率；基准利率", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：【知识延伸】法定存款准备金率、再贴现率、公开市场业务、基准利率法定存款准备金率： 中央银行规定的商业银行对于存款所必须保持的____的比例。", "a": "准备金", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：再贴现率：商业银行将其贴现的____票据向中央银行申请再贴现时的预扣利率。", "a": "未到期", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：公开市场业务：中央银行通过____有价证券，吞吐基础货币，调节货币供应量的活动。", "a": "买进或卖出", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：基准利率：中央银行规定的____利率。", "a": "存贷款", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：如职工薪酬、____、企业缴纳税金等。", "a": "最低工资保障", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：再分配属于宏观分配行为，主要由____以收入税等形式进行。", "a": "政府", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：如个人所得税、____、转移支付、公务员工资等。", "a": "社会保障", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：第三次分配建立在志愿性的基础上，以____方式进行。", "a": "慈善公益", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：汇率标价方法直接标价法：以一定单位的____为标准来计算应付出多少单位本国货币。", "a": "外国货币", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：间接标价法：以一定单位的____为标准来计算应收多少单位的外国货币。", "a": "本国货币", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：____事件：明显的、高概率的、早已存在，但却被人们有意或无意忽视，最终可能酿成重大危机的事件。", "a": "灰犀牛", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：边际效用递减：在一定时间内，在其他商品的消费数量保持不变的条件下，当一个人连续消费某种物品时，随着所消费的该物品的数量增加，其所带来的效用的增加量有____的趋势。", "a": "递减", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：拉弗曲线：当税率在一定的限度以下时，提高税率能增加政府税收收入，但超过这一限度时，再提高税率反而导致政府税收收入____。", "a": "减少", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：一般具有两大特征：（1）____：消费者对某种物品的消费并不会影响其他人对该物品的消费。", "a": "非竞争性", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：____：消费者对某种物品的消费并不会阻止其他人对该物品的消费。", "a": "非排他性", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：恩格尔系数：表示____总额占个人消费支出总额的比重。", "a": "食品支出", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：通常将其作为衡量家庭或国家____的指标，恩格尔系数越大，一个国家或家庭生活越____；", "a": "富裕程度；贫困", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：反之，恩格尔系数越小，生活越____。", "a": "富裕", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：它是用来综合考察居民内部收入分配____的指标。", "a": "差异状况", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：基尼系数介于____之间，基尼系数越大，表示收入分配差距越____、越____；", "a": "0-1；大；不公平", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：国际上通常将____作为赤字率的警戒线。", "a": "3%", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：代表“随时能花的钱”，反映____购买力。", "a": "现实", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：代表“所有的钱”，反映____购买力。", "a": "潜在", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：知识点8 经济效应挤出效应：政府通过增加支出来刺激经济时，可能会导致利率上升，从而____了私人投资和消费的现象。", "a": "减少", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：口红效应：因经济萧条而导致口红热卖，廉价产品在收入降低时需求量反而____。", "a": "增加", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：棘轮效应：人的消费习惯形成之后有____，即易于向上调整，而难于向下调整。", "a": "不可逆性", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：____：强者愈强、弱者愈弱的现象，即两极分化现象。", "a": "马太效应", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：____：也称羊群效应，是指经济个体的从众跟风心理。", "a": "从众效应", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：凡勃伦效应：消费者对某些商品的需求程度，因其标价较高而____。", "a": "增加", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：【知识延伸】外部效应（外部性）正外部效应（正外部性）：某种经济活动给与这项活动无关的第三方带来的____。", "a": "利益", "src": "pdf1016_common"}, {"d": "经济", "p": 2, "q": "填空：负外部效应（负外部性）：某种经济活动给与这项活动无关的第三方带来的____。", "a": "成本", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：太阳（1）太阳结构按照由里往外的顺序，太阳由核心、辐射区、对流层、____、____、日冕层构成。", "a": "光球层；色球层", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：太阳大气：光球层、____、日冕层。", "a": "色球层", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____是用肉眼可以观测到的太阳表面。", "a": "光球层", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：太阳辐射太阳辐射是指太阳以____的形式向外传递能量。", "a": "电磁波", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：能量来源于太阳内部____原子____。", "a": "氢；核聚变", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：太阳活动太阳活动的表现包括太阳黑子、太阳耀斑（____）、日珥（____）和日冕物质抛射等，其中太阳黑子和____是太阳活动的主要标志。", "a": "色球层；色球层；耀斑", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：太阳活动的周期大约是11 年，时烈时弱，往往引起地球上____、磁暴和电离层扰动等现象。", "a": "极光", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：【知识延伸】太阳黑子的最早记录中国是世界上首先发现太阳黑子的国家，最早在《____》中有记载。", "a": "汉书", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：八大行星按离太阳____的顺序排列为：水星、金星、地球、火星、木星、土星、天王星、海王星。", "a": "从近到远", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：水星：离太阳____、公转速度____、体积和质量____、昼夜温差最大的行星。", "a": "最近；最快；最小", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：古代被称为“____”或“昏星”。", "a": "辰星", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：金星：自转方向____，距地球最近、自转最慢、夜空中____的行星。", "a": "自东向西；最亮", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：古代被称为“____”“____”“太白”。", "a": "长庚；启明", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：火星：表面富含____，被称为“红色星球”。", "a": "氧化铁", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：木星：质量和体积____、自转____的行星。", "a": "最大；最快", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____：行星环最为明亮。", "a": "土星", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____：大气活动最猛烈、表面风速最快，是唯一利用数学预测而非有计划的观测发现的行星。", "a": "海王星", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】小行星带1.位置介于____轨道和____轨道之间。", "a": "火星；木星", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：类型C型：主要成分为碳质，富含____和水合矿物。", "a": "碳", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：S型：主要成分为____（石质）和金属。", "a": "硅酸盐", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：M型：主要成分为金属（主要为____和镍）。", "a": "铁", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：自转运动（1）方向：____（2）周期：自转约为24 小时（3）地理意义①____昼夜现象的出现原因在于地球是一个既不发光、也不透明的球体。", "a": "自西向东；昼夜交替", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：②时差全球共划分为24 个时区，每个时区跨____个经度，相邻两个时区的区时相差1 小时。", "a": "15", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：在同一日期内，时间上是____。", "a": "东早西晚", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：知识点3 月球1.概述月球是地球____的天然卫星，是离地球最近的天体。", "a": "唯一", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：月亮本身不发光，____的是太阳的光。", "a": "反射", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____是月面上最显著的地貌特征。", "a": "环形山", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：由于缺乏大气层保护，月球昼夜温差____。", "a": "极大", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：月球____逆时针方向自转，自转周期与公转周期都大约为27 天7 小时，故月球是一颗同步卫星。", "a": "自西向东", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：月球引力是地球海洋____产生最主要的原因。", "a": "潮汐", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】____地球引力导致月球自转速度逐渐减慢，最终使其自转周期与公转周期完全一致，导致月球总是以同一面（正面）朝向地球。", "a": "潮汐锁定", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：月相新月（朔） 上弦月满月（望） 下弦月日期（农历） ____ 初七、初八 ____ 二十二、二十三外观不可见半圆形亮面朝西圆形半圆形亮面朝东3.日食和月食日食月食概念 ____运动到太阳和地球中间，三者在一条直线。", "a": "初一；十五、十六；月球", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____运动到太阳和月球中间，三者在一条直线。", "a": "初一", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____区风力很小，天气晴朗。", "a": "台风", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：每年夏秋季节，我国____地区是台风登陆的主要地区。", "a": "东南沿海", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】热带气旋热带气旋，在北半球热带气旋中的气流绕中心呈____方向旋转，在南半球热带气旋中的气流绕中心呈____方向旋转。", "a": "逆时针；顺时针", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：洪涝我国洪涝灾害四季都可能发生，主要发生在____季节。", "a": "夏秋", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：干旱在我国，干旱天气，在春夏季节分布普遍，以西北、____及东北地区为主。", "a": "华北", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：旱灾是我国发生范围____、频率最高、持续时间最长的渐发性气象灾害。", "a": "最广", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：沙尘暴主要发生在____季节，我国____地区是沙尘暴频繁发生的地区。", "a": "冬春；西北", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：寒潮确定寒潮的标准是某一地区冷空气过境后，气温24 小时内下降____以上，且最低气温下降到____以下；", "a": "8℃；4℃", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：我国寒潮主要发生在____，影响范围大，西北、华北及东北地区较为严重。", "a": "冬半年", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：知识点6 二十四节气1.二十四节气的内容春天的节气：立春、雨水、____、春分、清明、谷雨。", "a": "惊蛰", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：夏天的节气：立夏、小满、____、夏至、小暑、大暑。", "a": "芒种", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：秋天的节气：立秋、____、白露、秋分、寒露、霜降。", "a": "处暑", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：冬天的节气：立冬、小雪、大雪、____、小寒、大寒。", "a": "冬至", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：个与我国接壤的国家：朝鲜、蒙古、俄罗斯、____、吉尔吉斯斯坦、塔吉克斯坦、印度、尼泊尔、不丹、阿富汗、____、缅甸、老挝、____。", "a": "哈萨克斯坦；巴基斯坦；越南", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：个隔海相望的国家：____、韩国、菲律宾、____、文莱、印度尼西亚。", "a": "日本；马来西亚", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：第一阶梯平均海拔4000 米以上，分布着____高原、____盆地。", "a": "青藏；柴达木", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：第二阶梯平均海拔1000—2000 米，分布着内蒙古高原、黄土高原、____高原、____盆地、准噶尔盆地、四川盆地。", "a": "云贵；塔里木", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】三级阶梯的分界线一、二阶梯分界线：____—祁连山脉—横断山脉二、三阶梯分界线：大兴安岭—____—巫山—雪峰山2.地形我国地形复杂多样，山区面积广大，占陆地总面积的三分之二。", "a": "昆仑山脉；太行山脉", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：四大高原____高原世界海拔最高的高原，被称为“世界屋脊”“世界第三极”。", "a": "青藏", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____高原称为“瀚海”，我国最平坦的高原，有典型的风蚀地貌。", "a": "内蒙古", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____高原世界黄土分布最广，流水侵蚀，地表千沟万壑。", "a": "黄土", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____高原喀斯特地貌发育典型，地势崎岖不平，有许多“坝子”。", "a": "云贵", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：四大盆地____盆地我国面积最大的盆地、最大的____。", "a": "塔里木；准噶尔", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：分布有塔克拉玛干沙漠（我国面积最大的沙漠，世界____流动沙漠）。", "a": "内流盆地", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____盆地我国位置最北、纬度最高的盆地，有典型的风蚀雅丹地貌。", "a": "第二大", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：柴达木盆地我国地势____的盆地，有盐、石油、煤以及多种金属矿藏，被称为“____”，有风蚀雅丹地貌。", "a": "最高；聚宝盆", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：四川盆地我国四大盆地中地势____的盆地、我国最大的外流盆地，被称为“____”“紫色盆地”。", "a": "最低；红色盆地", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：三大平原东北平原我国____的平原，地跨黑、吉、辽和内蒙古四个省区，由三江平原、____（面积最大）、辽河平原组成。", "a": "面积最大；松嫩平原", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：这是全球仅有的三大____区域之一。", "a": "黑土", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：长江中下游平原地跨鄂、湘、赣、皖、苏、浙、沪等 7 省市，湖泊密布，素有“____”“水乡泽国”的美誉。", "a": "鱼米之乡", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】喀斯特、雅丹、丹霞地貌1.喀斯特地貌：可溶性岩石（石灰岩等）被____溶蚀、侵蚀形成的地貌。", "a": "水", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：我国典型代表有____、广西____、贵州织金洞等。", "a": "云南石林；桂林山水", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：海河、____、淮河、____、钱塘江五大水系。", "a": "黄河；长江", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：二、主要湖泊1.五大淡水湖：____（赣）、____（湘）、太湖（苏）、洪泽湖（苏）、巢湖（皖）为我国主要淡水湖泊。", "a": "鄱阳湖；洞庭湖", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：其中____是我国面积最大的淡水湖，也是我国第二大湖。", "a": "鄱阳湖", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____：位于青海省，是我国最大的内陆湖泊，也是我国最大的咸水湖。", "a": "青海湖", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：纳木错：位于西藏自治区，是我国第三大咸水湖，是世界____的咸水湖。", "a": "海拔最高", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：艾丁湖：位于新疆吐鲁番盆地，是我国____的湖泊，属于内陆咸水湖。", "a": "海拔最低", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____：新疆海拔最高、面积最大的高山冷水湖，被称为“大西洋最后一滴眼泪”。", "a": "赛里木湖", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：半湿润区与半干旱区、____毫米等降水量线的分界线：从大兴安岭向西南，经张家口、兰州、拉萨附近，到喜马拉雅山的南坡。", "a": "400", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：我国是____能提供全部17 种稀土元素的国家，稀土的储备量、生产量、加工能力均为世界____。", "a": "唯一；第一", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：内蒙古____稀土矿是世界最大的稀土矿。", "a": "白云鄂博", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：四大佛教名山：山西五台山、浙江____、四川峨眉山、安徽____。", "a": "普陀山；九华山", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：四大道教名山：安徽齐云山、湖北____、四川青城山、江西____。", "a": "武当山；龙虎山", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：四大石窟：甘肃敦煌____、山西大同云冈石窟、河南洛阳____、甘肃天水麦积山石窟。", "a": "莫高窟；龙门石窟", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：【知识延伸】四大石窟____：开凿时间从十六国时期至元代，以壁画和彩塑为主要表现形式。", "a": "莫高窟", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____：北魏时期开凿，是中国第一个由皇室直接主持开凿的大型石窟群，被誉为“北魏皇家石窟典范”。", "a": "云冈石窟", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____：开凿于北魏孝文帝年间，唐宋时期扩建，被誉为“中国石刻艺术的最高峰”，是中国现存窟龛最多的石窟，也是中国古碑刻最多的一处，有“古碑林”之称。", "a": "龙门石窟", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：____：始建于十六国后秦时期，后经十余个王朝的扩建和修缮，以泥塑艺术见长，被誉为“东方雕塑陈列馆”。", "a": "麦积山石窟", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：四大名楼：山西鹳雀楼、江西____、湖北黄鹤楼、湖南岳阳楼。", "a": "滕王阁", "src": "pdf1016_common"}, {"d": "地理", "p": 2, "q": "填空：长江三峡：西起重庆____，东至湖北南津关，由瞿塘峡、____、西陵峡组成。", "a": "白帝城；巫峡", "src": "pdf1016_common"}, {"d": "地理", "p": 1, "q": "填空：____瀑布：位于贵州省，是我国最大的瀑布。", "a": "黄果树", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：①一般诉讼时效期间及起算期间：____。", "a": "三年", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：起算：自权利人知道或者应当知道____以及____之日起计算。", "a": "权利受到损害；义务人", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：②最长诉讼时效期间及起算期间：____。", "a": "二十年", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：起算：自____之日起计算；", "a": "权利受到损害", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：诉讼时效期间的特殊起算规则①当事人约定同一债务分期履行的，诉讼时效期间自____履行期限届满之日起计算。", "a": "最后一期", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：②无民事行为能力人或者限制民事行为能力人对其法定代理人的请求权的诉讼时效期间，自该法定____之日起计算。", "a": "代理终止", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：③未成年人遭受____的损害赔偿请求权的诉讼时效期间，自受害人年满____之日起计算。", "a": "性侵害；十八周岁", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：不适用诉讼时效的情形（1）请求____、排除妨碍、____；", "a": "停止侵害；消除危险", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：____和登记的____的权利人请求返还财产；", "a": "不动产物权；动产物权", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：请求支付____、____或者____；", "a": "抚养费；赡养费；扶养费", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：知识点4 物权1.物权：物权是指权利人依法对特定的物享有直接支配和排他的权利，包括____、____和____。", "a": "所有权；用益物权；担保物权", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：物权变动基本规则（1）不动产物权变动：不动产物权的设立、变更、转让和消灭，经____，发生效力；", "a": "登记", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：动产物权变动：对于一般动产，其物权的设立和转让，自____时发生效力；", "a": "交付", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：对于特殊动产，如____、____和机动车等，由于其价值较大，其物权的设立、变更、转让和消灭，____，不得对抗善意第三人。", "a": "船舶；航空器；未经登记", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：所有权（1）所有权的取得①先占：以所有人的意思占有____而取得其所有权。", "a": "无主动产", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：②善意取得：____他人财产的占有人，在不法将其占有的他人财产让与第三人后，如果受让人在取得该财产时系出于善意，即取得该财产的所有权，原财产所有人不得要求受让人返还。", "a": "无权处分", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：构成要件：出让人____；", "a": "无权处分", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：受让人受让该不动产或者动产时是____；", "a": "善意的", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：以合理的价格____；", "a": "转让", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：应当登记的____，不需要登记的____。", "a": "已登记；已交付", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：法律后果：原所有人____请求善意第三人____，善意受让人取得不动产或者动产的所有权，原所有权人有权向____请求赔偿损失。", "a": "无权；返还原物；无处分权人", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：____、盗赃物、____不适用善意取得。", "a": "遗失物；埋藏物", "src": "pdf1016_common"}, {"d": "民法", "p": 2, "q": "填空：拾得人应当____权利人领取，或者送交公安等有关部门。", "a": "及时通知", "src": "pdf1016_common" /* ---------- 工具 ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return n<10?'0'+n:''+n; }
function toDate(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(s,n){ const d=toDate(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function diffDays(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }
function fmtDate(s){ const p=s.split('-'); return p[1]+'月'+p[2]+'日'; }

const INTERVALS=[1,2,4,7,12,20,35,60,90];
const DECK_ORDER=['法理','宪法','刑法','民法','行政法','劳动','公文','马哲','党史','中特','道德','时政','经济','管理','人文','科技','地理','省情','综测','职测'];
const DECK_NAME={法理:'法律·法理',宪法:'法律·宪法',刑法:'法律·刑法',民法:'法律·民法',行政法:'法律·行政法',劳动:'法律·劳动社保',公文:'公文',马哲:'政治·马哲',党史:'政治·党史毛概',中特:'政治·中特新思想',道德:'政治·道德',时政:'时政',经济:'经济',管理:'管理·事业单位',人文:'人文历史',科技:'科技·生活常识',地理:'地理常识',省情:'四川省情',综测:'综测·写作',职测:'职测·公式'};
function deckIdx(d){ const i=DECK_ORDER.indexOf(d); return i<0?99:i; }
function deckName(d){ return DECK_NAME[d]||d; }
const DECK_ALIAS={'思政':'中特','政治':'中特','政治理论':'中特','法律':'法理','行测':'职测','省考':'职测','事业单位':'管理','综合':'综测','常识':'人文'};
function normDeck(name){
  let n=String(name==null?'':name).replace(/[!\uFF01★☆\s]/g,'').trim();
  if(!n) return '人文';
  if(DECK_NAME[n]) return n;
  for(const k in DECK_NAME){ if(DECK_NAME[k]===n) return k; }
  if(DECK_ALIAS[n]) return DECK_ALIAS[n];
  const stripped=n.replace(/^(法律|政治)[·\.、]/,'');
  if(DECK_NAME[stripped]) return stripped;
  for(const k of DECK_ORDER){ if(DECK_NAME[k].includes(n)||n.includes(DECK_NAME[k])||DECK_NAME[k].replace(/^[^·]+·/,'')===n) return k; }
  return n;
}
function allDecks(){
  const extra=[];
  state.cards.forEach(c=>{ if(DECK_ORDER.indexOf(c.d)<0 && extra.indexOf(c.d)<0) extra.push(c.d); });
  return DECK_ORDER.concat(extra.sort());
}
/* 批量导入解析：支持两种格式
   ①文字版（推荐）：每张卡以 [科目] 开头（科目后加!表示高频）
      [刑法] 问题第一行
      答案可以多行，直到下一个 [ ] 开头的行为止
      [刑法!] 问题 ||| 答案      ← 单行写法也可
   ②JSON：[{"d":"刑法","q":"...","a":"...","p":1}, ...]（或 {"cards":[...]}） */
function parseCardText(txt){
  const out=[], errs=[];
  let t=String(txt||'').replace(/\r\n?/g,'\n').trim();
  if(!t) return {out,errs};
  if(t[0]==='{' || (t[0]==='[' && /^\[\s*[{"]/.test(t))){
    try{
      const o=JSON.parse(t);
      const arr=Array.isArray(o)?o:(o.cards||[]);
      if(Array.isArray(arr)&&arr.length){
        arr.forEach(c=>{
          if(c&&c.q&&c.a){ out.push({d:normDeck(c.d||c.deck||'人文'),q:String(c.q).trim(),a:String(c.a).trim(),p:c.p===1?1:2}); }
          else errs.push('JSON里有卡片缺少 q 或 a');
        });
        return {out,errs};
      }
    }catch(e){ /* 按文字格式继续解析 */ }
  }
  const lines=t.split('\n');
  let cur=null;
  const flush=()=>{
    if(!cur) return;
    const q=cur.q.join('\n').trim(), a=cur.a.join('\n').trim();
    if(q&&a) out.push({d:cur.d,q:q,a:a,p:cur.p});
    else errs.push('有一张卡缺问题或答案：「'+(q||'(空)').slice(0,16)+'…」');
    cur=null;
  };
  lines.forEach(raw=>{
    const line=raw.replace(/\s+$/,'');
    const m=line.match(/^\s*[\[【]([^\]】]+)[\]】]\s*(.*)$/);
    if(m){
      flush();
      const rawDeck=m[1];
      const hi=/[!\uFF01★]/.test(rawDeck);
      cur={d:normDeck(rawDeck),p:hi?1:2,q:[],a:[],qDone:false};
      let rest=m[2].trim();
      if(rest){
        const sp=rest.split('|||');
        if(sp.length>=2){
          cur.q.push(sp[0].trim()); cur.qDone=true;
          const aRest=sp.slice(1).join('|||').trim(); if(aRest) cur.a.push(aRest);
        } else { cur.q.push(rest); cur.qDone=true; }
      }
      return;
    }
    if(!cur){
      if(line.trim()) errs.push('有内容不在任何 [科目] 之下，已忽略：「'+line.trim().slice(0,16)+'…」');
      return;
    }
    if(line.trim()==='') return;
    if(!cur.qDone){ cur.q.push(line); cur.qDone=true; return; }
    cur.a.push(line);
  });
  flush();
  return {out,errs};
}
