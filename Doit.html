<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>公基记忆卡 · 四川事业编 SRS</title>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#1c2430; --ink2:#5b6b7f; --line:#e3e8f0;
  --blue:#2f6fed; --blue-d:#2559c4; --red:#e5484d; --orange:#e8930c; --green:#23a06b; --purple:#7b5cd6;
  --shadow:0 2px 10px rgba(23,43,77,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif; font-size:15px; line-height:1.6; padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}
#banner{display:none;background:#fff3cd;color:#7a5b00;border-bottom:1px solid #f0dfa8;padding:8px 12px;font-size:13px;text-align:center}
#banner.on{display:block}
header{background:linear-gradient(135deg,#2f6fed,#5b8dfa); color:#fff; padding:14px 0 12px; box-shadow:var(--shadow)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;letter-spacing:.5px}
.brand .sub{font-size:12px;font-weight:400;opacity:.85;margin-left:6px}
.hud{font-size:13px;opacity:.95;display:flex;gap:12px;flex-wrap:wrap}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(23,43,77,.04)}
nav .wrap{display:flex;overflow-x:auto;gap:2px}
nav button{flex:0 0 auto;border:0;background:transparent;padding:12px 14px;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
main{padding-top:14px}
.panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.panel h3{font-size:15px;margin:16px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:13px}
.chip{display:inline-block;background:#eef3fe;color:var(--blue-d);border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px}
.chip.orange{background:#fdf1dc;color:#9a6206}
.chip.green{background:#e3f6ec;color:#1a7a51}
.chip.gray{background:#eef1f5;color:#5b6b7f}
.chip.red{background:#fde8e8;color:#b3261e}
.bar{height:8px;background:#edf1f7;border-radius:999px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f6fed,#5b8dfa);border-radius:999px;transition:width .25s}
.q{font-size:19px;font-weight:600;line-height:1.55;margin:10px 0 4px;word-break:break-word}
.a{font-size:16px;line-height:1.75;background:#f7faff;border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.btn{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;background:#eef3fe;color:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:#f1f4f9;color:var(--ink2)}
.btn.wide{width:100%}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:10px;padding:12px 4px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;line-height:1.25}
.rate button small{display:block;font-size:11px;font-weight:400;opacity:.9}
.r1{background:var(--red)} .r2{background:var(--orange)} .r3{background:var(--blue)} .r4{background:var(--green)}
.rate button:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:12.5px}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:110px;resize:vertical;font-size:12.5px;line-height:1.5}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
details summary{cursor:pointer;font-weight:700;font-size:14.5px}
details[open]{background:#fff}
ul.tight{margin:8px 0;padding-left:20px}
ul.tight li{margin:5px 0}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:12px;background:#fbfcfe;color:var(--ink2)}
.footnote{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.6}
.cardlist .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.cardlist .item .qq{font-weight:600}
.cardlist .item .aa{color:var(--ink2);font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.small{font-size:12px}
.center{text-align:center}
.big{font-size:34px;font-weight:800;color:var(--blue)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fbfcfe}
.stat b{display:block;font-size:20px;color:var(--blue)}
.stat span{font-size:12px;color:var(--ink2)}
@media(max-width:560px){
  .grid3{grid-template-columns:1fr 1fr}
  .q{font-size:17.5px}
  .rate button{font-size:13px;padding:11px 2px}
}
</style>
</head>

<script>
/* ========== 公基记忆卡 · SRS 间隔复习系统 ==========
   算法：Leitner/SM 简化版。每张卡有一个"熟练档位"step(0-8)，
   对应间隔天数 [1,2,4,7,12,20,35,60,90]。评分四档：
   忘记→回档0且当天重来；模糊→退1档；记得→进1档；熟练→进2档。
   每天动态计算新卡额度：复习越多，新卡越少（防止雪崩）。
===================================================== */
const DECK = {"updated": "2025公基高频450考点已并入（2026-10-13）", "note": "四川事业编公基卡片库 v1，按考试分值权重分配；p=1 表示高频必背卡", "cards": [{"d": "宪法", "p": 1, "q": "我国现行宪法是什么时候通过的？", "a": "1982年12月4日通过。此后历经1988、1993、1999、2004、2018年五次修正；12月4日为国家宪法日。"}, {"d": "宪法", "p": 1, "q": "修改宪法的程序？", "a": "由全国人大常委会或1/5以上的全国人大代表提议，并由全国人民代表大会以全体代表的2/3以上多数通过。"}, {"d": "宪法", "p": 1, "q": "全国人大与全国人大常委会的立法分工？", "a": "全国人大制定和修改刑事、民事、国家机构的和其他的基本法律；常委会制定和修改其他法律，并有权解释宪法、监督宪法实施。"}, {"d": "宪法", "p": 1, "q": "我国的国体（国家性质）是什么？", "a": "中华人民共和国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。"}, {"d": "宪法", "p": 1, "q": "我国的根本政治制度与基本政治制度？", "a": "根本政治制度：人民代表大会制度。基本政治制度：中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度。"}, {"d": "宪法", "p": 1, "q": "国家主席的任职条件？", "a": "有选举权和被选举权的年满45周岁的中国公民；每届任期5年（2018年修宪后不再有连任届数限制）。"}, {"d": "宪法", "p": 1, "q": "哪些国家领导职务连续任职不得超过两届？", "a": "全国人大常委会委员长、副委员长，国务院总理、副总理、国务委员，国家监委主任，最高法院长，最高检检察长。注意：2018年修宪后国家主席、副主席不再受两届限制。"}, {"d": "宪法", "p": 1, "q": "逮捕公民的法定程序？", "a": "必须经人民检察院批准或者决定，或者经人民法院决定，并由公安机关执行。"}, {"d": "宪法", "p": 1, "q": "既是权利又是义务的基本权利是哪两项？", "a": "劳动权和受教育权。"}, {"d": "宪法", "q": "在什么情况下公民可以获得物质帮助权？", "a": "公民在年老、疾病或者丧失劳动能力的情况下，有从国家和社会获得物质帮助的权利。"}, {"d": "宪法", "q": "公民的政治权利和自由包括哪些？", "a": "选举权和被选举权；言论、出版、集会、结社、游行、示威的自由。"}, {"d": "宪法", "q": "民族自治地方与自治机关分别是什么？", "a": "自治地方：自治区、自治州、自治县（乡级不设自治）；自治机关：自治地方的人民代表大会和人民政府（不含法院、检察院）。"}, {"d": "宪法", "q": "特别行政区享有哪些权力？", "a": "享有高度自治权：行政管理权、立法权、独立的司法权和终审权；国防、外交权属于中央。"}, {"d": "宪法", "q": "我国的基层群众自治形式？村委会任期多长？", "a": "村民委员会、居民委员会；村委会每届任期5年，可连选连任。"}, {"d": "宪法", "q": "我国最高国家权力机关及其执行机关？", "a": "最高国家权力机关：全国人民代表大会；最高国家权力机关的执行机关：国务院。"}, {"d": "宪法", "q": "国家监察委员会何时入宪？主任任期限制？", "a": "2018年修宪时写入宪法；国家监委主任连续任职不得超过两届。"}, {"d": "刑法", "p": 1, "q": "刑法的基本原则有哪些？", "a": "罪刑法定原则、适用刑法人人平等原则、罪责刑相适应原则。"}, {"d": "刑法", "p": 1, "q": "完全负刑事责任的年龄？", "a": "已满16周岁的人犯罪，应当负刑事责任。"}, {"d": "刑法", "p": 1, "q": "14—16周岁相对负刑责的八种行为？", "a": "故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质。"}, {"d": "刑法", "p": 1, "q": "12—14周岁什么情况下要被追诉？", "a": "犯故意杀人、故意伤害罪，致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民检察院核准追诉的，应当负刑事责任。"}, {"d": "刑法", "p": 1, "q": "什么是特别防卫？", "a": "对正在进行的行凶、杀人、抢劫、强奸、绑架以及其他严重危及人身安全的暴力犯罪采取防卫行为，造成不法侵害人伤亡的，不属于防卫过当，不负刑事责任。"}, {"d": "刑法", "p": 1, "q": "犯罪未完成形态三种及其处罚？", "a": "预备：可以从轻、减轻或免除处罚；未遂：可以从轻或减轻处罚；中止：没有造成损害的免除处罚，造成损害的减轻处罚。"}, {"d": "刑法", "p": 1, "q": "主刑和附加刑分别有哪些？", "a": "主刑：管制、拘役、有期徒刑、无期徒刑、死刑。附加刑：罚金、剥夺政治权利、没收财产（驱逐出境只适用外国人）。"}, {"d": "刑法", "p": 1, "q": "缓刑的适用条件？哪三种人应当宣告缓刑？", "a": "被判处拘役或3年以下有期徒刑，且情节较轻、有悔罪表现、无再犯危险、对社区无重大不良影响，可以宣告缓刑；不满18周岁、怀孕的妇女、已满75周岁的应当宣告缓刑。"}, {"d": "刑法", "p": 1, "q": "不适用死刑的情形？", "a": "犯罪时不满18周岁的人和审判时怀孕的妇女不适用死刑；审判时已满75周岁的原则上不适用（以特别残忍手段致人死亡的除外）。"}, {"d": "刑法", "p": 1, "q": "贪污罪的构成要点？", "a": "主体是国家工作人员（含受委托管理、经营国有财产的人员）；利用职务便利侵吞、窃取、骗取或者以其他手段非法占有公共财物。"}, {"d": "刑法", "q": "受贿罪的构成？", "a": "国家工作人员利用职务上的便利，索取他人财物，或者非法收受他人财物并为他人谋取利益。"}, {"d": "刑法", "q": "滥用职权罪与玩忽职守罪的区别？", "a": "滥用职权多为故意（超越职权、乱作为）；玩忽职守是过失（不履行或不认真履行职责），二者都要求致使公共财产、国家和人民利益遭受重大损失。"}, {"d": "刑法", "q": "挪用公款归个人使用的三种情形？", "a": "进行非法活动；数额较大进行营利活动；数额较大且超过3个月未还。"}, {"d": "民法", "p": 1, "q": "民事行为能力如何划分？", "a": "不满8周岁为无民事行为能力人；8周岁以上不满18周岁为限制民事行为能力人（16周岁以上以自己劳动收入为主要生活来源的视为完全）；18周岁以上为完全民事行为能力人。"}, {"d": "民法", "p": 1, "q": "普通诉讼时效期间是多久？", "a": "3年，自权利人知道或应当知道权利受到损害以及义务人之日起计算；最长保护期20年。"}, {"d": "民法", "p": 1, "q": "哪些请求权不适用诉讼时效？", "a": "请求停止侵害、排除妨碍、消除危险；不动产物权和登记的动产物权权利人请求返还财产；请求支付抚养费、赡养费、扶养费。"}, {"d": "民法", "q": "宣告失踪和宣告死亡的条件？", "a": "宣告失踪：下落不明满2年。宣告死亡：一般下落不明满4年；因意外事故下落不明满2年；因意外事故下落不明经有关机关证明不可能生存的不受2年限制。"}, {"d": "民法", "p": 1, "q": "善意取得的三个条件？", "a": "受让人受让时是善意的；以合理价格转让；转让的动产已交付、不动产已登记。"}, {"d": "民法", "p": 1, "q": "用益物权包括哪些？", "a": "土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权。"}, {"d": "民法", "p": 1, "q": "抵押、质押、留置的区别？", "a": "抵押不转移占有；质押要转移占有（动产质押、权利质押）；留置是法定担保物权，只适用于动产。"}, {"d": "民法", "p": 1, "q": "遗嘱有哪些形式？多份遗嘱效力怎么算？", "a": "自书、代书、打印、录音录像、口头、公证六种；立有数份内容相抵触的遗嘱，以最后的有效遗嘱为准（民法典取消了公证遗嘱的优先效力）。"}, {"d": "民法", "p": 1, "q": "法定继承的顺序？", "a": "第一顺序：配偶、子女、父母；第二顺序：兄弟姐妹、祖父母、外祖父母。丧偶儿媳/女婿对公婆/岳父母尽了主要赡养义务的，作为第一顺序继承人。"}, {"d": "民法", "q": "什么是代位继承？", "a": "被继承人的子女先于被继承人死亡的，由该子女的直系晚辈血亲代位继承；民法典新增：被继承人的兄弟姐妹先于其死亡的，由其子女代位继承。"}, {"d": "民法", "p": 1, "q": "结婚的法定年龄？婚姻无效的情形？", "a": "男不得早于22周岁、女不得早于20周岁；无效婚姻：重婚、有禁止结婚的亲属关系、未到法定婚龄。"}, {"d": "民法", "q": "离婚冷静期怎么规定的？", "a": "协议离婚：自婚姻登记机关收到离婚登记申请之日起30日内，任何一方可撤回申请；冷静期届满后30日内双方应亲自申请发证，未申请的视为撤回离婚登记申请。"}, {"d": "民法", "p": 1, "q": "承担民事责任的方式有哪些（举例）？", "a": "停止侵害、排除妨碍、消除危险、返还财产、恢复原状、修理重作更换、继续履行、赔偿损失、支付违约金、消除影响恢复名誉、赔礼道歉等。"}, {"d": "民法", "q": "无民事行为能力人在学校受伤，学校怎么担责？", "a": "过错推定：学校能证明尽到教育、管理职责的不承担责任；限制民事行为能力人受损害则适用过错责任原则。"}, {"d": "民法", "q": "高空抛物如何担责？", "a": "法律禁止从建筑物中抛掷物品；公安等机关应依法及时调查；物业服务企业等未采取必要安全保障措施的承担相应责任。"}, {"d": "民法", "q": "什么是表见代理？", "a": "行为人没有代理权、超越代理权或代理权终止后仍实施代理行为，相对人有理由相信行为人有代理权的，该代理行为有效。"}, {"d": "民法", "q": "民法典共几编？分别是？", "a": "七编：总则、物权、合同、人格权、婚姻家庭、继承、侵权责任（人格权独立成编是重大亮点）。"}, {"d": "行政法", "p": 1, "q": "行政处罚的种类（要点）？", "a": "警告、通报批评；罚款、没收违法所得和非法财物；暂扣或吊销许可证件、降低资质等级；限制生产经营、责令停产停业、责令关闭、限制从业；行政拘留。"}, {"d": "行政法", "p": 1, "q": "行政处罚的追责时效？", "a": "一般2年；涉及公民生命健康安全、金融安全且有危害后果的为5年。"}, {"d": "行政法", "q": "行政处罚听证程序要点？", "a": "当事人应在行政机关告知后5日内提出听证要求；行政机关应当在举行听证的7日前通知当事人时间、地点。"}, {"d": "行政法", "p": 1, "q": "行政复议和行政诉讼的期限？", "a": "行政复议申请期限60日；行政诉讼起诉期限一般6个月；经复议后不服的，15日内向法院起诉。"}, {"d": "行政法", "q": "行政复议向谁申请？", "a": "对县级以上地方政府工作部门的行为不服，可向本级人民政府或上一级主管部门申请；对海关、金融、外汇等垂直领导部门的行为不服，向上一级主管部门申请。"}, {"d": "行政法", "q": "复议机关维持或改变原行为时，被告如何确定？", "a": "复议维持：作出原行为的机关和复议机关是共同被告；复议改变：复议机关是被告。"}, {"d": "行政法", "p": 1, "q": "国家赔偿的责任原则和请求时效？", "a": "违法归责原则（违法行使职权造成损害才赔）；请求时效2年。"}, {"d": "行政法", "p": 1, "q": "公务员处分的种类和处分期？", "a": "种类：警告、记过、记大过、降级、撤职、开除。期间：警告6个月、记过12个月、记大过18个月、降级和撤职24个月。"}, {"d": "行政法", "p": 1, "q": "新录用公务员的试用期是多久？", "a": "1年。"}, {"d": "行政法", "q": "行政行为的效力内容包括？", "a": "公定力、确定力、拘束力、执行力。"}, {"d": "行政法", "q": "什么是行政许可？", "a": "行政机关根据公民、法人或其他组织的申请，经依法审查，准予其从事特定活动的行为。"}, {"d": "劳动", "p": 1, "q": "试用期期限有什么限制？", "a": "劳动合同3个月以上不满1年：试用期不超过1个月；1年以上不满3年：不超过2个月；3年以上固定期限和无固定期限：不超过6个月。"}, {"d": "劳动", "p": 1, "q": "试用期工资标准？", "a": "不得低于本单位相同岗位最低档工资或劳动合同约定工资的80%，并不得低于用工所在地最低工资标准。"}, {"d": "劳动", "p": 1, "q": "加班工资怎么算？", "a": "平时延长工作时间不低于150%；休息日安排工作又不能补休的不低于200%；法定节假日不低于300%。"}, {"d": "劳动", "q": "经济补偿怎么算？", "a": "每满1年支付1个月工资；6个月以上不满1年按1年算；不满6个月支付半个月工资。"}, {"d": "劳动", "p": 1, "q": "哪些情形应当认定为工伤？", "a": "在工作时间和工作场所内因工作原因受到事故伤害；工作时间前后在工作场所内从事与工作有关的预备性或收尾性工作受伤；上下班途中受到非本人主要责任的交通事故等。"}, {"d": "劳动", "q": "领取失业保险金的条件？", "a": "失业前用人单位和本人已缴纳失业保险费满1年；非因本人意愿中断就业；已办理失业登记并有求职要求。"}, {"d": "公文", "p": 1, "q": "党政机关15种法定公文文种？", "a": "决议、决定、命令(令)、公报、公告、通告、意见、通知、通报、报告、请示、批复、议案、函、纪要。"}, {"d": "公文", "p": 1, "q": "请示和报告有什么区别？", "a": "请示：事前行文、一文一事、必须答复（向上级请求指示或批准）；报告：汇报工作反映情况、一般不要求答复、不得夹带请示事项。"}, {"d": "公文", "p": 1, "q": "公告和通告的区别？", "a": "公告面向国内外宣布重要事项或法定事项；通告在一定范围内公布应当遵守或周知的事项。"}, {"d": "公文", "p": 1, "q": "通知和通报的区别？", "a": "通知：发布规章、传达要求下级执行或周知的事项、批转转发公文、任免人员；通报：表彰先进、批评错误、传达重要精神和告知重要情况。"}, {"d": "公文", "p": 1, "q": "函适用于什么？", "a": "不相隶属机关之间商洽工作、询问和答复问题、请求批准和答复审批事项。"}, {"d": "公文", "p": 1, "q": "纪要的适用与格式特殊点？", "a": "适用于记载会议主要情况和议定事项；纪要一般不加盖印章。"}, {"d": "公文", "q": "命令(令)的四种用途？", "a": "公布行政法规和规章；宣布施行重大强制性措施；批准授予和晋升衔级；嘉奖有关单位和人员。"}, {"d": "公文", "p": 1, "q": "批复和意见分别适用于什么？", "a": "批复：答复下级机关请示事项；意见：对重要问题提出见解和处理办法，可上行、下行、平行行文。"}, {"d": "公文", "q": "决议和决定的区别？", "a": "决议适用于会议讨论通过的重大决策事项；决定适用于对重要事项作出决策和部署、奖惩有关单位和人员、变更或撤销下级机关不适当决定。"}, {"d": "公文", "q": "议案适用于什么？", "a": "各级人民政府按照法律程序向本级人民代表大会或其常务委员会提请审议事项。"}, {"d": "公文", "p": 1, "q": "公文格式分哪三个部分？各含哪些要素？", "a": "版头：份号、密级和保密期限、紧急程度、发文机关标志、发文字号、签发人；主体：标题、主送机关、正文、附件说明、发文机关署名、成文日期、印章、附注、附件；版记：抄送机关、印发机关和印发日期、页码。"}, {"d": "公文", "p": 1, "q": "发文字号的组成规则？", "a": "发文机关代字+年份+发文顺序号；年份用六角括号〔〕括入并标全称，如〔2026〕；顺序号不加“第”字、不编虚位（不写01）、后加“号”字。"}, {"d": "公文", "p": 1, "q": "公文标题的构成与省略规则？", "a": "发文机关+事由+文种，可省略发文机关；标题中除法规、规章名称加书名号外，一般不用标点符号。"}, {"d": "公文", "p": 1, "q": "成文日期怎么标？以什么时间为准？", "a": "用阿拉伯数字标全年、月、日，月日不编虚位；以负责人签发的日期为准，联合行文以最后签发机关负责人签发的日期为准。"}, {"d": "公文", "q": "密级和紧急程度分别有哪些？", "a": "密级：秘密、机密、绝密（绝密最高）；紧急程度：特急、加急；电报：特提、特急、加急、平急。"}, {"d": "公文", "p": 1, "q": "公文中的“签发人”什么时候标注？", "a": "上行文应当标注签发人姓名（下行文、平行文不标）。"}, {"d": "公文", "p": 1, "q": "行文规则的三条核心？", "a": "原则上不得越级行文；向上级机关行文原则上主送一个上级机关，不得抄送下级机关；请示应当一文一事，报告中不得夹带请示事项。"}, {"d": "公文", "q": "受双重领导的机关如何行文？", "a": "向一个上级机关行文，必要时抄送另一个上级机关。"}, {"d": "公文", "q": "向下级机关的重要行文要不要抄送？", "a": "向下级机关或本系统的重要行文，应当同时抄送发文机关的直接上级机关。"}, {"d": "公文", "p": 1, "q": "收文办理的程序？", "a": "签收、登记、初审、承办、传阅、催办、答复。"}, {"d": "公文", "p": 1, "q": "发文办理的程序？", "a": "复核、登记、印制、核发。"}, {"d": "公文", "q": "办毕公文如何处置？", "a": "需要归档的及时归档；不具备归档和保存价值的按规定销毁；涉密公文按规定清退或销毁。"}, {"d": "公文", "q": "附件说明和附件的位置区别？", "a": "附件说明标注附件名称和序号，写在正文之后、发文机关署名之前；附件另页附在正文之后。"}, {"d": "公文", "q": "公文语言的特点？", "a": "准确、简明、庄重、朴实、规范。"}, {"d": "公文", "q": "公文的主要作用？", "a": "领导和指导作用、规范作用、宣传教育作用、联系沟通作用、凭证依据作用。"}, {"d": "马哲", "p": 1, "q": "哲学基本问题是哪两个方面？", "a": "思维和存在（意识和物质）的关系：第一，谁是第一性（划分唯物主义和唯心主义）；第二，思维能否正确认识存在（划分可知论和不可知论）。"}, {"d": "马哲", "p": 1, "q": "物质的唯一特性是什么？", "a": "客观实在性；运动是物质的根本属性和存在方式。"}, {"d": "马哲", "p": 1, "q": "意识的能动作用表现在哪些方面？", "a": "意识活动具有目的性和计划性、主动创造性；意识能指导实践改造世界；能调控人的行为和生理活动。但意识是物质的产物和反映。"}, {"d": "马哲", "p": 1, "q": "唯物辩证法的三大规律？", "a": "对立统一规律（实质与核心）、质量互变规律、否定之否定规律。"}, {"d": "马哲", "p": 1, "q": "矛盾特殊性的方法论意义？", "a": "具体问题具体分析（马克思主义活的灵魂）；矛盾普遍性与特殊性的关系就是共性与个性的关系。"}, {"d": "马哲", "p": 1, "q": "实践与认识的关系？", "a": "实践是认识的来源、动力、目的和检验真理的唯一标准；认识对实践具有反作用（正确认识促进、错误认识阻碍）。"}, {"d": "马哲", "q": "真理有哪些属性？", "a": "客观性（真理内容是客观的）；具体性和条件性；绝对性与相对性的统一。"}, {"d": "马哲", "p": 1, "q": "唯物史观的两大基本规律？", "a": "生产力决定生产关系、生产关系反作用于生产力；经济基础决定上层建筑、上层建筑反作用于经济基础。社会基本矛盾是社会发展的根本动力。"}, {"d": "马哲", "q": "社会存在与社会意识的关系？", "a": "社会存在决定社会意识；社会意识具有相对独立性，对社会存在有能动的反作用。"}, {"d": "马哲", "p": 1, "q": "为什么说人民群众是历史的创造者？", "a": "人民群众是社会物质财富和精神财富的创造者，是社会变革的决定力量；要坚持群众观点和群众路线。"}, {"d": "马哲", "q": "量变与质变的辩证关系？", "a": "量变是质变的必要准备，质变是量变的必然结果；要重视量的积累，抓住时机促成质变。"}, {"d": "马哲", "q": "发展的实质是什么？", "a": "新事物的产生和旧事物的灭亡（发展的实质是事物的前进和上升）。"}, {"d": "党史", "p": 1, "q": "毛泽东思想的活的灵魂？", "a": "实事求是（是精髓）、群众路线、独立自主。"}, {"d": "党史", "p": 1, "q": "中国革命的三大法宝？", "a": "统一战线、武装斗争、党的建设。"}, {"d": "党史", "p": 1, "q": "新民主主义革命总路线？", "a": "无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。"}, {"d": "党史", "p": 1, "q": "中国革命走的是什么道路？", "a": "农村包围城市、武装夺取政权（井冈山道路）。"}, {"d": "党史", "p": 1, "q": "中共一大什么时候在哪里召开？", "a": "1921年7月，上海——后转移到浙江嘉兴南湖游船上；这是党诞生的标志。"}, {"d": "党史", "q": "遵义会议的意义？", "a": "1935年1月召开，确立了毛泽东在党中央和红军的领导地位，是党的历史上生死攸关的转折点。"}, {"d": "党史", "q": "八七会议提出了什么著名论断？", "a": "1927年8月7日，毛泽东提出“枪杆子里面出政权”。"}, {"d": "党史", "p": 1, "q": "中共七大什么时候召开？有何重大意义？", "a": "1945年在延安召开，确立毛泽东思想为党的指导思想并写入党章。"}, {"d": "党史", "q": "党的三大优良作风？", "a": "理论联系实际、密切联系群众、批评与自我批评。"}, {"d": "党史", "p": 1, "q": "“两个务必”和“三个务必”分别是什么？", "a": "两个务必（七届二中全会）：务必保持谦虚、谨慎、不骄、不躁的作风，务必保持艰苦奋斗的作风。三个务必（二十大）：务必不忘初心、牢记使命；务必谦虚谨慎、艰苦奋斗；务必敢于斗争、善于斗争。"}, {"d": "党史", "p": 1, "q": "十一届三中全会的意义？", "a": "1978年12月召开，把党和国家工作重心转移到经济建设上来，实行改革开放，是党的历史上具有深远意义的伟大转折。"}, {"d": "党史", "q": "中共十四大的重大贡献？", "a": "1992年召开，确立我国经济体制改革的目标是建立社会主义市场经济体制。"}, {"d": "党史", "p": 1, "q": "我国社会主要矛盾在十九大上怎么表述？", "a": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾（此前1981年表述为：人民日益增长的物质文化需要同落后的社会生产之间的矛盾）。"}, {"d": "党史", "p": 1, "q": "邓小平理论的首要基本问题？社会主义的本质是什么？", "a": "首要基本问题：什么是社会主义、怎样建设社会主义。社会主义本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。"}, {"d": "中特", "p": 1, "q": "“两个确立”是什么？", "a": "确立习近平同志党中央的核心、全党的核心地位；确立习近平新时代中国特色社会主义思想的指导地位。"}, {"d": "中特", "p": 1, "q": "“五位一体”总体布局？", "a": "经济建设、政治建设、文化建设、社会建设、生态文明建设。"}, {"d": "中特", "p": 1, "q": "“四个全面”战略布局？", "a": "全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。"}, {"d": "中特", "p": 1, "q": "新发展理念五个词？", "a": "创新、协调、绿色、开放、共享。"}, {"d": "中特", "p": 1, "q": "中国式现代化的五个特征？", "a": "人口规模巨大的现代化、全体人民共同富裕的现代化、物质文明和精神文明相协调的现代化、人与自然和谐共生的现代化、走和平发展道路的现代化。"}, {"d": "中特", "p": 1, "q": "高质量发展的定位？新发展格局是什么？", "a": "高质量发展是全面建设社会主义现代化国家的首要任务；新发展格局：以国内大循环为主体、国内国际双循环相互促进。"}, {"d": "中特", "q": "新时代党的建设总要求中的“主线”是什么？", "a": "加强党的长期执政能力建设、先进性和纯洁性建设。"}, {"d": "中特", "q": "党的根本宗旨和初心使命？", "a": "根本宗旨：全心全意为人民服务。初心使命：为中国人民谋幸福、为中华民族谋复兴。"}, {"d": "中特", "q": "习近平新时代中国特色社会主义思想回答了什么课题？“十个明确”是什么层面的概括？", "a": "系统回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义（集中体现为“十个明确”“十四个坚持”“十三个方面成就”）。"}, {"d": "中特", "p": 1, "q": "二十届三中全会的主题？", "a": "进一步全面深化改革、推进中国式现代化（2024年7月召开）。"}, {"d": "中特", "p": 1, "q": "二十届四中全会通过了什么重要文件？", "a": "2025年10月20日—23日召开，审议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》。"}, {"d": "中特", "q": "党的根本组织原则和领导制度？", "a": "民主集中制（民主基础上的集中和集中指导下的民主相结合）。"}, {"d": "中特", "q": "“三个有利于”判断标准？", "a": "是否有利于发展社会主义社会的生产力、是否有利于增强社会主义国家的综合国力、是否有利于提高人民的生活水平。"}, {"d": "中特", "q": "“一国两制”构想由谁为解决什么问题提出？", "a": "邓小平为解决台湾问题而提出；成功实践于香港（1997年）、澳门（1999年）回归。"}, {"d": "中特", "q": "党的“六大纪律”指哪些？", "a": "政治纪律、组织纪律、廉洁纪律、群众纪律、工作纪律、生活纪律。"}, {"d": "中特", "q": "入党的年龄条件和预备期？", "a": "年满18周岁、承认党的纲领和章程等；预备期为1年。"}, {"d": "道德", "p": 1, "q": "社会主义核心价值观24字？", "a": "国家层面：富强、民主、文明、和谐；社会层面：自由、平等、公正、法治；个人层面：爱国、敬业、诚信、友善。"}, {"d": "道德", "q": "公民基本道德规范？", "a": "爱国守法、明礼诚信、团结友善、勤俭自强、敬业奉献。"}, {"d": "道德", "q": "社会公德的主要内容？", "a": "文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法。"}, {"d": "道德", "q": "职业道德的主要内容？", "a": "爱岗敬业、诚实守信、办事公道、服务群众、奉献社会。"}, {"d": "时政", "p": 1, "q": "“十五五”规划建议是何时通过的？结构如何？", "a": "2025年10月党的二十届四中全会审议通过；全文共15个部分、61条，分三大板块。"}, {"d": "时政", "p": 1, "q": "“十五五”规划纲要何时审查批准？2026年是什么年？", "a": "2026年3月十四届全国人大四次会议审查批准；2026年是“十五五”开局之年。"}, {"d": "时政", "p": 1, "q": "“十五五”主要目标的7个方面？", "a": "高质量发展取得显著成效、科技自立自强水平大幅提高、进一步全面深化改革取得新突破、社会文明程度明显提升、人民生活品质不断提高、美丽中国建设取得新的重大进展、国家安全屏障更加巩固。"}, {"d": "时政", "p": 1, "q": "“十五五”时期必须遵循的“六个坚持”原则？", "a": "坚持党的全面领导、坚持人民至上、坚持高质量发展、坚持全面深化改革、坚持有效市场和有为政府相结合、坚持统筹发展和安全。"}, {"d": "时政", "p": 1, "q": "2026年发展主要预期目标（数字要记）？", "a": "经济增长4.5%—5%；城镇调查失业率5.5%左右；城镇新增就业1200万人以上；居民消费价格涨幅2%左右；粮食产量1.4万亿斤左右；单位GDP二氧化碳排放降低3.8%左右。"}, {"d": "时政", "p": 1, "q": "“十五五”规划纲要提出多少项重大工程？", "a": "6方面109项重大工程（新质生产力28项、现代化基础设施23项等）。"}, {"d": "时政", "q": "2026年政府工作报告提出的新兴支柱产业和未来产业？", "a": "新兴支柱产业：集成电路、航空航天、生物医药、低空经济；未来产业：未来能源、量子科技、具身智能、脑机接口、6G；并部署整治“内卷式”竞争、深化“人工智能+”行动。"}, {"d": "时政", "q": "2026年有哪些重要周年纪念？", "a": "建党105周年（7月1日）、长征胜利90周年（10月）、辛亥革命115周年（10月10日）、孙中山诞辰160周年。"}, {"d": "时政", "p": 1, "q": "2025年最重大的纪念活动是什么？", "a": "纪念中国人民抗日战争暨世界反法西斯战争胜利80周年（2025年9月3日）；同时“十四五”规划圆满收官。"}, {"d": "时政", "p": 1, "q": "四川“四化同步、城乡融合、五区共兴”中“五区”指哪五个区？", "a": "成都平原经济区、川南经济区、川东北经济区、攀西经济区、川西北生态示范区。"}, {"d": "时政", "p": 1, "q": "2026年四川省政府工作报告的总体取向？", "a": "深入实施“四化同步、城乡融合、五区共兴”发展战略，全力以赴拼经济搞建设，提升成渝地区双城经济圈发展能级，建设现代化经济强省，“十五五”时期经济增速保持高于全国平均水平。"}, {"d": "时政", "q": "四川2026年布局的重大科技专项？", "a": "加快前沿科技攻坚，布局实施人工智能、高端航空装备等9个重大科技专项（此前省委十二届五次全会部署人工智能、航空航天、先进装备、生物制造、清洁能源、先进材料6个重大科技专项）。"}, {"d": "时政", "q": "四川获批的国家级平台、四川的算力地位？", "a": "获批建设国家数字经济创新发展试验区；提速优化“东数西算”国家枢纽节点建设；成都纳入全国要素市场化配置综合改革试点。"}, {"d": "时政", "q": "四川城市工作的口号？", "a": "建设具有四川特色的现代化人民城市，围绕“公园城市、安逸家园”，支持成都深化建设践行新发展理念的公园城市示范区。"}, {"d": "经济", "p": 1, "q": "商品的二因素与劳动二重性？", "a": "商品二因素：使用价值和价值（价值是商品特有的社会属性）；劳动二重性：具体劳动创造使用价值，抽象劳动创造价值。"}, {"d": "经济", "p": 1, "q": "剩余价值率怎么算？", "a": "剩余价值率＝剩余价值÷可变资本＝剩余劳动时间÷必要劳动时间。"}, {"d": "经济", "q": "绝对剩余价值与相对剩余价值的区别？", "a": "绝对剩余价值：延长工作日的绝对长度；相对剩余价值：提高劳动生产率、缩短必要劳动时间。"}, {"d": "经济", "p": 1, "q": "GDP、CPI、PPI分别是什么？", "a": "GDP：国内生产总值（地域概念）；CPI：居民消费价格指数；PPI：工业生产者出厂价格指数。"}, {"d": "经济", "p": 1, "q": "基尼系数与恩格尔系数分别衡量什么？", "a": "基尼系数衡量收入分配差距（0—1之间，0.4为警戒线）；恩格尔系数：食品支出占消费总支出的比重（越低越富裕）。"}, {"d": "经济", "p": 1, "q": "治理通货膨胀用什么政策组合？", "a": "紧缩性财政政策（减少支出、增加税收）＋紧缩性货币政策（提高存款准备金率、提高利率、公开市场卖出）。"}, {"d": "经济", "p": 1, "q": "三大货币政策工具？", "a": "存款准备金率、再贴现（率）、公开市场业务。"}, {"d": "经济", "q": "财政政策的工具？", "a": "税收、国债、政府购买支出、转移支付。"}, {"d": "经济", "q": "失业的三种类型？", "a": "摩擦性失业、结构性失业、周期性失业。"}, {"d": "经济", "p": 1, "q": "社会保障体系包括哪些？核心和最低层次分别是什么？", "a": "社会保险、社会救助、社会福利、社会优抚；社会保险是核心，社会救助是最低层次，社会优抚对象是军人及其家属。"}, {"d": "经济", "q": "初次分配、再分配、第三次分配？", "a": "初次分配：市场按要素分配；再分配：政府通过税收、社保等调节；第三次分配：社会自愿的公益慈善。"}, {"d": "经济", "q": "供求与价格的关系？", "a": "商品价格围绕价值上下波动；供不应求价格上涨，供过于求价格下跌；价格变动又调节供求。"}, {"d": "管理", "p": 1, "q": "管理的四项基本职能？", "a": "计划、组织、领导、控制（贯穿其中的是决策）。"}, {"d": "管理", "q": "管理幅度与管理层次的关系？", "a": "反比关系：管理幅度越大，管理层次越少（组织结构趋于扁平化）。"}, {"d": "管理", "p": 1, "q": "马斯洛需求层次理论的五个层次？", "a": "生理需要、安全需要、社交（归属与爱）需要、尊重需要、自我实现需要。"}, {"d": "管理", "p": 1, "q": "赫茨伯格双因素理论？", "a": "保健因素（工资、政策、工作环境等）只能消除不满；激励因素（成就、认可、工作本身等）才能带来满意。"}, {"d": "管理", "q": "目标管理（MBO）由谁提出？核心是什么？", "a": "德鲁克提出；核心：以目标为导向、员工参与、自我控制、重视成果。"}, {"d": "管理", "q": "木桶效应、蝴蝶效应、马太效应分别是什么？", "a": "木桶效应：整体受短板制约；蝴蝶效应：微小变化引起巨大连锁反应；马太效应：强者愈强、弱者愈弱。"}, {"d": "管理", "q": "晕轮效应、首因效应、近因效应是什么？", "a": "晕轮效应：以偏概全的光环偏差；首因效应：第一印象影响判断；近因效应：最近获得的信息影响更大。"}, {"d": "管理", "q": "破窗效应、鲶鱼效应、羊群效应、手表定律？", "a": "破窗：小问题不及时纠正会蔓延；鲶鱼：引入竞争激发活力；羊群：从众跟风；手表定律：多头标准反而无法行动。"}, {"d": "管理", "p": 1, "q": "事业单位岗位分为哪三类？", "a": "管理岗位、专业技术岗位、工勤技能岗位。"}, {"d": "管理", "p": 1, "q": "事业单位工作人员处分的种类？", "a": "警告、记过、降低岗位等级或撤职、开除（共4种）。"}, {"d": "管理", "p": 1, "q": "事业单位工作人员考核的内容和结果等次？", "a": "内容：德、能、勤、绩、廉；结果分为优秀、合格、基本合格、不合格四个等次。"}, {"d": "管理", "p": 1, "q": "事业单位聘用合同期限和试用期？", "a": "聘用合同期限一般不低于3年；初次就业且合同期限3年以上的，试用期为12个月。"}, {"d": "管理", "q": "事业单位改革的方向？", "a": "政事分开、事企分开、管办分离，强化公益属性（公益一类、公益二类分类改革）。"}, {"d": "管理", "q": "事业单位可以解除聘用合同的旷工情形？", "a": "连续旷工超过15个工作日，或1年内累计旷工超过30个工作日。"}, {"d": "人文", "p": 1, "q": "我国第一部诗歌总集是什么？分哪三部分？", "a": "《诗经》，收录西周初年至春秋中叶305篇，分为风、雅、颂三部分。"}, {"d": "人文", "p": 1, "q": "屈原的文学地位与代表作？", "a": "我国第一位伟大的爱国诗人，楚辞体代表；代表作《离骚》《九歌》《天问》。"}, {"d": "人文", "p": 1, "q": "“四书五经”指哪些？", "a": "四书：《大学》《中庸》《论语》《孟子》；五经：《诗经》《尚书》《礼记》《周易》《春秋》。"}, {"d": "人文", "p": 1, "q": "《史记》和《资治通鉴》的体裁？作者？", "a": "《史记》：司马迁著，我国第一部纪传体通史；《资治通鉴》：司马光著，编年体通史。"}, {"d": "人文", "q": "百家争鸣的代表人物及主张？", "a": "孔子（仁、礼）、孟子（仁政）、荀子（性恶论）、老子（道法自然）、庄子（逍遥）、韩非（法术势、以法治国）、墨子（兼爱、非攻）。"}, {"d": "人文", "p": 1, "q": "唐宋八大家是谁？", "a": "韩愈、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。"}, {"d": "人文", "p": 1, "q": "李白、杜甫的雅号？初唐四杰？", "a": "李白“诗仙”、杜甫“诗圣”；初唐四杰：王勃、杨炯、卢照邻、骆宾王。"}, {"d": "人文", "p": 1, "q": "宋词的豪放派和婉约派代表？", "a": "豪放派：苏轼、辛弃疾；婉约派：柳永、李清照。"}, {"d": "人文", "q": "元曲四大家/代表作？", "a": "关汉卿《窦娥冤》、王实甫《西厢记》、马致远《天净沙·秋思》等。"}, {"d": "人文", "p": 1, "q": "四大名著作者分别是谁？", "a": "《三国演义》罗贯中、《水浒传》施耐庵、《西游记》吴承恩、《红楼梦》曹雪芹。"}, {"d": "人文", "p": 1, "q": "鲁迅的代表作有哪些？", "a": "小说集《呐喊》《彷徨》，小说《阿Q正传》，散文集《朝花夕拾》，杂文集《坟》等；中国现代文学奠基人。"}, {"d": "人文", "p": 1, "q": "老舍的代表作？“人民艺术家”指谁？", "a": "老舍：《骆驼祥子》《四世同堂》《茶馆》《龙须沟》；老舍被誉为“人民艺术家”。"}, {"d": "人文", "q": "巴金和曹禺的代表作？", "a": "巴金：《家》《春》《秋》（激流三部曲）、《寒夜》；曹禺：话剧《雷雨》《日出》《原野》《北京人》。"}, {"d": "人文", "q": "茅盾的代表作？", "a": "《子夜》《林家铺子》；农村三部曲：《春蚕》《秋收》《残冬》。"}, {"d": "人文", "q": "沈从文、朱自清、徐志摩的代表作？", "a": "沈从文《边城》；朱自清《背影》《荷塘月色》；徐志摩（新月派）《再别康桥》。"}, {"d": "人文", "p": 1, "q": "中国古代著名战役与其结果（记四场）？", "a": "长平之战：秦胜赵（白起、赵括）；巨鹿之战：项羽破秦；官渡之战：曹操胜袁绍；赤壁之战：孙刘联军胜曹，奠定三国鼎立基础；淝水之战：东晋胜前秦（“草木皆兵”）。"}, {"d": "人文", "p": 1, "q": "科举制何时创立、何时废除？“连中三元”指什么？", "a": "隋朝创立，1905年废除；连中三元＝乡试解元＋会试会元＋殿试状元。"}, {"d": "人文", "p": 1, "q": "二十四节气反映什么？从哪个节气开始？", "a": "反映太阳周年运动；从立春开始到大寒结束；2016年列入联合国人类非物质文化遗产。"}, {"d": "人文", "q": "古代年龄称谓：20、30、40、50、60、70、100分别称什么？", "a": "弱冠20、而立30、不惑40、知天命50、花甲60、古稀70、期颐100。"}, {"d": "人文", "q": "书法绘画常识（记四个）？", "a": "王羲之《兰亭序》为“天下第一行书”；楷书颜真卿、柳公权（颜筋柳骨）；吴道子被称“画圣”；张择端《清明上河图》、王希孟《千里江山图》。"}, {"d": "人文", "p": 1, "q": "中国近代史的开端和第一个不平等条约？", "a": "1840年鸦片战争是中国近代史的开端；1842年《南京条约》是中国近代第一个不平等条约（割香港岛、五口通商）。"}, {"d": "人文", "q": "甲午中日战争的时间与结果条约？", "a": "1894—1895年；《马关条约》割让台湾及澎湖列岛；黄海海战中邓世昌壮烈殉国。"}, {"d": "人文", "p": 1, "q": "辛亥革命的标志事件与意义？", "a": "1911年10月10日武昌起义；推翻了封建帝制、建立了共和制度。"}, {"d": "人文", "p": 1, "q": "五四运动的时间和历史地位？", "a": "1919年爆发；是中国新民主主义革命的开端。"}, {"d": "人文", "p": 1, "q": "建党、建军的标志事件？", "a": "建党：1921年中共一大；建军：1927年南昌起义（8月1日建军节）。"}, {"d": "人文", "p": 1, "q": "九一八事变、西安事变、七七事变的意义？", "a": "1931年九一八事变：局部抗战开始；1936年西安事变：抗日民族统一战线初步形成；1937年七七事变：全面抗战开始。"}, {"d": "人文", "p": 1, "q": "抗战胜利的关键时间点？", "a": "1945年8月15日日本宣布无条件投降；9月3日为中国人民抗日战争胜利纪念日；12月13日为南京大屠杀死难者国家公祭日。"}, {"d": "人文", "p": 1, "q": "长征的起止时间与三大主力会师？", "a": "1934年10月开始；1936年10月红军三大主力在甘肃会宁会师，长征胜利结束（2026年为长征胜利90周年）。"}, {"d": "人文", "q": "文艺复兴的核心思想与代表人物？", "a": "核心思想：人文主义；文学三杰：但丁（《神曲》）、彼特拉克、薄伽丘；美术三杰：达·芬奇、米开朗基罗、拉斐尔。"}, {"d": "人文", "q": "新航路开辟与世界资产阶级革命的标志文件？", "a": "1492年哥伦布到达美洲，麦哲伦船队首次环球航行；英国1689年《权利法案》、美国1776年《独立宣言》、法国1789年《人权宣言》。"}, {"d": "人文", "q": "两次世界大战与联合国、十月革命？", "a": "一战1914—1918年；二战1939—1945年；1917年俄国十月革命建立世界上第一个社会主义国家；1945年联合国成立。"}, {"d": "人文", "q": "中国传统节日与主要习俗（春节、端午、中秋、重阳）？", "a": "春节：贴春联、守岁；端午：赛龙舟、吃粽子（纪念屈原）；中秋：赏月、吃月饼；重阳：登高、敬老。"}, {"d": "科技", "p": 1, "q": "中国古代四大发明？", "a": "造纸术、印刷术、火药、指南针。"}, {"d": "科技", "p": 1, "q": "中国空间站、载人飞船、月球探测工程分别叫什么？", "a": "空间站“天宫”；载人飞船“神舟”；月球探测“嫦娥”（嫦娥六号于2024年实现世界首次月球背面采样返回）。"}, {"d": "科技", "q": "北斗和C919？", "a": "北斗三号全球卫星导航系统2020年建成开通；C919是我国自主研制的大型客机，2023年完成商业首航。"}, {"d": "科技", "p": 1, "q": "双碳目标是什么？", "a": "二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和。"}, {"d": "科技", "q": "量子科技的代表性成果？", "a": "“墨子号”量子科学实验卫星、“九章”量子计算原型机、“祖冲之号”超导量子计算原型机。"}, {"d": "科技", "p": 1, "q": "发现天然气泄漏应该怎么做？", "a": "立即关闭阀门、开窗通风；严禁明火、严禁开关电器（包括开灯、打电话）；人员撤离到室外后再报警。"}, {"d": "科技", "q": "火灾逃生要点？", "a": "湿毛巾捂口鼻、低姿弯腰沿疏散通道撤离；不乘电梯；逆风逃生；无法逃生时到背火房间封堵门缝等待救援。"}, {"d": "科技", "q": "触电急救的正确步骤？", "a": "先切断电源或用干燥绝缘物挑开电线；不可直接拉拽触电者；脱离电源后立即施救并拨打120。"}, {"d": "科技", "q": "地震发生时室内怎么避险？", "a": "就近躲避在坚固家具旁或卫生间等小开间，护住头颈；震后有序撤离，不乘电梯；室外远离高大建筑物和山崖。"}, {"d": "科技", "q": "食物中毒和中暑的处置？", "a": "食物中毒：及时催吐并就医，保留剩余食物样本；中暑：迅速移至阴凉通风处、补充含盐水分、严重者立即送医。"}, {"d": "省情", "p": 1, "q": "四川的简称、面积和行政区划？", "a": "简称川（蜀）；面积48.6万平方公里，居全国第5位；辖21个市（州）（18个市、3个自治州）。"}, {"d": "省情", "p": 1, "q": "四川的地形特点？“天府之国”指哪里？", "a": "地跨四川盆地、川西高原等；成都平原沃野千里，被誉为“天府之国”。"}, {"d": "省情", "p": 1, "q": "四川主要河流及“千河之省”的含义？", "a": "长江（金沙江）、岷江、沱江、嘉陵江、大渡河、雅砻江等；金沙江与岷江在宜宾汇合后始称长江，四川素有“千河之省”之称。"}, {"d": "省情", "p": 1, "q": "都江堰由谁主持修建？何时列入世界文化遗产？", "a": "战国时期秦国蜀郡太守李冰父子主持修建（无坝引水工程）；2000年与青城山共同列入世界文化遗产。"}, {"d": "省情", "p": 1, "q": "四川的世界遗产有哪些（6处）？", "a": "九寨沟、黄龙、峨眉山—乐山大佛、青城山—都江堰、四川大熊猫栖息地、中国南方喀斯特（兴文石海）。"}, {"d": "省情", "q": "三星堆和金沙遗址分别在哪儿？代表文物？", "a": "三星堆在广汉（青铜文明，青铜神树、纵目面具）；金沙遗址在成都（太阳神鸟金饰）。"}, {"d": "省情", "p": 1, "q": "四川最高的山？“蜀山之王”是谁？", "a": "贡嘎山，海拔7556米，被誉为“蜀山之王”；峨眉山海拔3099米。"}, {"d": "省情", "q": "四川代表性的历史文化名人（记四个）？", "a": "李白（江油）、杜甫（成都草堂）、苏轼（眉山三苏）、邓小平（广安）、朱德（仪陇）。"}, {"d": "省情", "p": 1, "q": "大熊猫国家公园何时设立？跨哪些省？", "a": "2021年正式设立，跨四川、陕西、甘肃三省；四川野生大熊猫种群数量全国第一。"}, {"d": "省情", "q": "四川与三线建设、航天的关联？", "a": "西昌卫星发射中心；攀枝花钢铁基地；成昆铁路是“三线建设”的代表性工程。"}, {"d": "省情", "q": "蜀绣、川剧等非物质文化遗产？", "a": "蜀绣是中国四大名绣之一（苏绣、湘绣、粤绣、蜀绣）；川剧绝活“变脸”；泸沽湖摩梭文化。"}, {"d": "省情", "p": 1, "q": "成渝地区双城经济圈的定位？", "a": "2020年中央财经委员会第六次会议提出；打造带动全国高质量发展的重要增长极和新的动力源。"}, {"d": "省情", "q": "四川重要的红色文化地标？", "a": "泸定桥（飞夺泸定桥）、川陕革命根据地（巴中）、红军长征在四川的众多遗址。"}, {"d": "综测", "p": 1, "q": "四川《综合能力测试》三道题的一般结构？", "a": "第一题：根据材料写内容摘要/编者按/导言（300—400字）；第二题：撰写某篇公文（事务文书居多）的某一部分，如调研方案的“调研内容”、报告的“优化建议”；第三题：大公文或大作文（800—1000字，有时要求不拘泥于背景材料）。"}, {"d": "综测", "p": 1, "q": "综测材料常考哪些场景？", "a": "事业单位日常工作场景：公共文化服务、科普宣传、智慧河长制、未成年人保护、社会体育、教育资源均衡、医疗卫生、科技馆科普等。"}, {"d": "综测", "p": 1, "q": "大作文的万能五段结构？", "a": "第一段：引材料＋亮明总论点；第二至四段：三个分论点段（分论点＋阐释＋例证＋回扣）；第五段：总结全文＋升华主题（呼应时代与岗位）。"}, {"d": "综测", "p": 1, "q": "分论点段内部怎么写？", "a": "四步：①亮分论点（句式整齐）②解释内涵（2—3句）③举例或说理（1—2个例子）④回扣总结（1句）。"}, {"d": "综测", "p": 1, "q": "对策类分论点的常见角度？", "a": "制度机制、人才队伍、技术赋能（数字化）、宣传引导、多元参与、经费保障、监督考核。"}, {"d": "综测", "q": "大作文标题的三种公式？", "a": "①对策式：以××绘就××新画卷；②意义式：让××成为××的××；③引用式：从“××”说开去。"}, {"d": "综测", "q": "事业单位写作要突出的“岗位特色”是什么？", "a": "公益属性、公共服务、群众需求导向；写作时多落在“服务群众最后一公里”“公共文化服务均等化”“便民惠民”等角度。"}, {"d": "综测", "p": 1, "q": "综述题（概括题）答题三步？", "a": "①审题定范围（对象、范围、字数）；②回材料划关键词（主体＋做法＋结果）；③分条书写（一是…二是…三是…，每条“核心词＋具体内容”）。"}, {"d": "综测", "q": "公文片段（如报告的“优化建议”部分）怎么写？", "a": "先总起一句（针对……提出如下建议），再分条：一是…二是…三是…；每条“动宾结构＋具体措施”，尽量用材料中的关键词。"}, {"d": "综测", "p": 1, "q": "作文金句：关于人民？", "a": "“人民对美好生活的向往，就是我们的奋斗目标”“江山就是人民，人民就是江山”“民生无小事，枝叶总关情”。"}, {"d": "综测", "q": "作文金句：关于担当实干？", "a": "“功成不必在我、功成必定有我”“空谈误国，实干兴邦”“干部干部，干是当头的”。"}, {"d": "综测", "q": "作文金句：关于文化与青年？", "a": "“文化自信是更基本、更深沉、更持久的力量”“青年兴则国家兴，青年强则国家强”“让收藏在博物馆里的文物、陈列在广阔大地上的遗产、书写在古籍里的文字活起来”。"}, {"d": "综测", "p": 1, "q": "作文自评清单（写完对一遍）？", "a": "①审题：对象、范围、字数都对吗？②结构：总论点统率分论点，分论点句式整齐吗？③素材：有具体例子/数据吗？④开头结尾有没有回扣主题？⑤卷面、时间是否达标（大作文限时60分钟）？"}, {"d": "职测", "p": 1, "q": "资料分析：基期量和增长量公式？", "a": "基期量＝现期量÷(1＋增长率)；增长量＝现期量－基期量＝现期量×增长率÷(1＋增长率)。"}, {"d": "职测", "p": 1, "q": "资料分析：比重、平均数、倍数？", "a": "比重＝部分÷整体；平均数＝总量÷份数；A是B的几倍＝A÷B。"}, {"d": "职测", "q": "比重上升还是下降怎么判断？", "a": "部分增速＞整体增速→比重上升；部分增速＜整体增速→比重下降。"}, {"d": "职测", "q": "间隔增长率、混合增长率的结论？", "a": "间隔增长率r＝r₁＋r₂＋r₁×r₂；混合增长率一定介于各部分增长率之间，且偏向基期量大的一方。"}, {"d": "职测", "p": 1, "q": "资料分析必背百化分（记6个）？", "a": "1/6≈16.7%、1/7≈14.3%、1/8＝12.5%、1/9≈11.1%、1/11≈9.1%、1/12≈8.3%。"}, {"d": "职测", "q": "截位直除怎么用？", "a": "先看选项差距：差距大分母截两位、差距小截三位，分子一般不动，快速估商定位答案。"}, {"d": "职测", "p": 1, "q": "工程问题怎么做？", "a": "核心：总量＝效率×时间。常用赋值法：赋值总量为各时间的最小公倍数，或赋值效率为1。"}, {"d": "职测", "p": 1, "q": "行程问题核心公式？", "a": "相遇：路程和＝速度和×时间；追及：路程差＝速度差×时间；流水：顺水速度＝船速＋水速。"}, {"d": "职测", "q": "经济利润问题公式？", "a": "利润＝售价－成本；利润率＝利润÷成本；打x折即原价×x/10。"}, {"d": "职测", "q": "浓度问题怎么算？", "a": "溶质＝溶液×浓度；两种溶液混合用十字交叉法求比例。"}, {"d": "职测", "p": 1, "q": "排列组合的加法原理和乘法原理？", "a": "分类用加法、分步用乘法；A(n,m)有顺序、C(n,m)无顺序。"}, {"d": "职测", "q": "两集合容斥公式？", "a": "A∪B＝A＋B－A∩B；总数＝A＋B－A∩B＋非A非B。"}, {"d": "职测", "q": "牛吃草问题公式？", "a": "原有草量＝（牛数－每天新长草量）×天数；抓住“原有草量不变”列方程。"}, {"d": "职测", "q": "等差数列常用公式？", "a": "和＝(首项＋末项)×项数÷2；项数＝(末项－首项)÷公差＋1；中位数×项数＝总和。"}, {"d": "职测", "q": "数量关系四大快解技巧？", "a": "代入排除法、赋值法、比例法、整除（奇偶）特性法——先看选项特征再决定用哪个。"}, {"d": "法理", "p": 1, "q": "法最显著的特征？", "a": "法是靠国家强制力保证实施的， 具有国家强制性", "src": "fb450", "no": 1}, {"d": "法理", "p": 1, "q": "法的规范作用？", "a": "指引自己、评价他人、教育一般人、预测相互间、强制违法者", "src": "fb450", "no": 2}, {"d": "法理", "p": 1, "q": "习惯、判例、政策、学理等属于？", "a": "法的非正式渊源", "src": "fb450", "no": 3}, {"d": "宪法", "p": 1, "q": "填空：修宪____；释宪____；督宪权____", "a": "修宪权全人大；释宪权全人常；督宪权全人大及全人常", "src": "fb450", "no": 4}, {"d": "宪法", "p": 1, "q": "法律的制定主体是什么？", "a": "全国人大及其常委会", "src": "fb450", "no": 5}, {"d": "宪法", "p": 1, "q": "全国人大有权制定基本法律；____", "a": "全国人大常委会有权制定非基本法律", "src": "fb450", "no": 6}, {"d": "行政法", "p": 1, "q": "行政法规的制定主体是什么？", "a": "国务院", "src": "fb450", "no": 7}, {"d": "法理", "p": 1, "q": "地方性法规的制定主体是什么？", "a": "省、自治区、直辖市人大及其常委会；设区的市、自治州的人大及其常委会", "src": "fb450", "no": 8}, {"d": "法理", "p": 1, "q": "同位阶法的效力:特别法 > 一般法、新法 > 旧法、____", "a": " 实体法>程序法", "src": "fb450", "no": 9}, {"d": "法理", "p": 1, "q": "空间效力上？", "a": "我国属地主义为主，与属人、保护主义相结合", "src": "fb450", "no": 10}, {"d": "宪法", "p": 1, "q": "权利和义务之间是什么？", "a": "对立统一的，没有无义务的权利，也没有无权利的义务", "src": "fb450", "no": 11}, {"d": "法理", "p": 1, "q": "法律关系的客体包括？", "a": "物、人身利益、精神财富和行为", "src": "fb450", "no": 12}, {"d": "法理", "p": 1, "q": "引起法律关系变动的原因是法律事实；法律事实分为？", "a": "法律行为和法律事件", "src": "fb450", "no": 13}, {"d": "宪法", "p": 1, "q": "宪法是国家根本法，表现为？", "a": "内容最根本、法律效力最高、制修程序最严", "src": "fb450", "no": 14}, {"d": "宪法", "p": 1, "q": "宪法效力最高？", "a": "派生普通法律、任何法不得与其相违背、是最高行为准则", "src": "fb450", "no": 15}, {"d": "宪法", "p": 1, "q": "宪法最主要、最核心价值它是什么？", "a": "公民权利的保障书", "src": "fb450", "no": 16}, {"d": "宪法", "p": 1, "q": "现行宪法于 1988年、1993年、1999年、____", "a": "2004年和 2018年进行了5次修改", "src": "fb450", "no": 17}, {"d": "宪法", "p": 1, "q": "补全考点（宪法修正案由全国……）：", "a": "宪法修正案由全国人大以全 const $  = s => document.querySelector(s);

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return n<10?'0'+n:''+n; }
function toDate(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(s,n){ const d=toDate(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function diffDays(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }

const DECK_ORDER=['法理','宪法','刑法','民法','行政法','劳动','公文','马哲','党史','中特','道德','时政','经济','管理','人文','科技','地理','省情','综测','职测'];
const DECK_NAME={法理:'法律·法理',宪法:'法律·宪法',刑法:'法律·刑法',民法:'法律·民法',行政法:'法律·行政法',劳动:'法律·劳动社保',公文:'公文',马哲:'政治·马哲',党史:'政治·党史毛概',中特:'政治·中特新思想',道德:'政治·道德',时政:'时政',经济:'经济',管理:'管理·事业单位',人文:'人文历史',科技:'科技·生活常识',地理:'地理常识',省情:'四川省情',综测:'综测·写作',职测:'职测·公式'};
function deckIdx(d){ const i=DECK_ORDER.indexOf(d); return i<0?99:i; }
function deckName(d){ return DECK_NAME[d]||d; }

/* ---------- 存储（预览环境降级为内存） ---------- */
const LS_KEY='scsyd_gk_srs_v1';

function save(){ if(!LS_OK) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){ if(!LS_OK) return false; try{ const s=localStorage.getItem(LS_KEY); if(!s) return false; const o=JSON.parse(s); if(!o||!o.cards) return false; state=Object.assign(state,o); state.cfg=Object.assign({},CFG0,o.cfg||{}); return true; }catch(e){ return false; } }
function countNew(){ return state.cards.filter(c=>c.step<0).length; }

function mergeDeck(){
  const have=new Set(state.cards.map(c=>c.id));
  let added=0;
  DECK.cards.forEach((c,i)=>{
    const id='d'+i;
    if(!have.has(id)){
      state.cards.push({id:id,d:c.d,q:c.q,a:c.a,p:c.p||2,step:-1,due:null,lapses:0,seen:0});
      added++;
    }
  });
  /* 老卡补齐新增字段 */
  state.cards.forEach(c=>{ if(typeof c.step!=='number') c.step=-1; if(typeof c.lapses!=='number') c.lapses=0; if(typeof c.seen!=='number') c.seen=0; if(typeof c.p!=='number') c.p=2; });
  return added;
}

/* ---------- 队列算法 ---------- */
function computeQuota(dueCount){
  const target=state.cfg.newPerDay||12;
  let q=target;
  if(dueCount>=80) q=Math.max(3,target-7);
  else if(dueCount>=50) q=Math.max(4,target-5);
  else if(dueCount>=30) q=Math.max(6,target-3);
  return Math.max(0,Math.min(q,countNew()));
}
function interleaveByDeck(list){
  const groups={};
  list.forEach(c=>{ (groups[c.d]=groups[c.d]||[]).push(c); });
  const keys=Object.keys(groups).sort((a,b)=>deckIdx(a)-deckIdx(b));
  const out=[]; let go=true;
  while(go){ go=false; keys.forEach(k=>{ if(groups[k].length){ out.push(groups[k].shift()); go=true; } }); }
  return out;
}
function buildQueue(filterDeck){
  const t=todayStr();
  let due=state.cards.filter(c=>c.step>=0 && c.due && c.due<=t);
  if(filterDeck) due=due.filter(c=>c.d===filterDeck);
  due.sort((a,b)=> a.due===b.due ? ((b.lapses||0)-(a.lapses||0)) : (a.due<b.due?-1:1));
  const quota=computeQuota(due.length);
  let fresh=state.cards.filter(c=>c.step<0);
  if(filterDeck) fresh=fresh.filter(c=>c.d===filterDeck);
  fresh.sort((a,b)=> (a.p-b.p) || (deckIdx(a.d)-deckIdx(b.d)) || (parseInt(a.id.slice(1),10)-parseInt(b.id.slice(1),10)));
  fresh=interleaveByDeck(fresh.slice(0,quota));
  const q=due.map(c=>c.id).concat(fresh.map(c=>c.id));
  return {queue:q, due:due.length, fresh:fresh.length};
}
function startSession(filterDeck){
  const b=buildQueue(filterDeck||null);
  session={ queue:b.queue, pos:0, revealed:false, done:0, filter:filterDeck||null,
    stats:{again:0,hard:0,good:0,easy:0,newCards:0,revCards:0}, reqs:{}, dueAtStart:b.due, freshAtStart:b.fresh, started:Date.now() };
  renderToday();
}
function cardById(id){ return state.cards.find(c=>c.id===id); }
function curCard(){ if(!session) return null; return cardById(session.queue[session.pos]); }

/* ---------- 评分 ---------- */
function logRate(r,isNew){
  const t=todayStr();
  if(!state.log[t]) state.log[t]={new:0,rev:0,again:0,hard:0,good:0,easy:0,total:0};
  const L=state.log[t];
  if(isNew) L.new++; else L.rev++;
  L[r]=(L[r]||0)+1; L.total++;
  if(state.streak.last!==t){
    state.streak.days = (state.streak.last===addDays(t,-1)) ? (state.streak.days||0)+1 : 1;
    state.streak.last=t;
  }
}
function rate(r){
  const c=curCard(); if(!c || !session || !session.revealed) return;
  const isNew=(c.seen===0);
  c.seen=(c.seen||0)+1;
  if(r==='again'){
    c.lapses=(c.lapses||0)+1; c.step=0; c.due=todayStr();
    session.reqs[c.id]=session.reqs[c.id]||0;
    if(session.reqs[c.id]<2){ session.reqs[c.id]++; session.queue.push(c.id); }
  } else if(r==='hard'){
    c.step = c.step<=0 ? 0 : c.step-1;
    c.due=addDays(todayStr(), INTERVALS[c.step]);
  } else if(r==='good'){
    c.step = c.step<0 ? 1 : Math.min(INTERVALS.length-1, c.step+1);
    c.due=addDays(todayStr(), INTERVALS[c.step]);
  } else {
    c.step = c.step<0 ? 2 : Math.min(INTERVALS.length-1, c.step+2);
    c.due=addDays(todayStr(), INTERVALS[c.step]);
  }
  session.stats[r]=(session.stats[r]||0)+1;
  if(isNew) session.stats.newCards++; else session.stats.revCards++;
  logRate(r,isNew);
  session.done++; session.pos++; session.revealed=false;
  save();
  renderToday();
}
function reveal(){ if(session && session.pos<session.queue.length){ session.revealed=true; renderToday(); } }

function draftNewPlan(){
  const remain=countNew();
  if(!remain) return '全部卡片已学过一轮，接下来靠到期复习和“忘记→今晚重来”循环巩固。';
  const per=state.cfg.newPerDay||12;
  const days=Math.ceil(remain/per);
  const done=addDays(todayStr(),days);
  const left=diffDays(todayStr(),state.cfg.examDate);
  return `剩余未学卡片 ${remain} 张：按每天 ${per} 张，预计 ${fmtDate(done)} 学完。距笔试还有 ${left} 天，之后每天只需复习到期卡片。`;
}
function footerHint(){
  return '若某科太薄弱，用下方筛选“只练该科”，把该科卡片先过一轮。';
}

    ${EXAM_TIPS.map(x=>`<h3>${esc(x[0])}</h3><p class="muted">${esc(x[1])}</p>`).join('')}
  </div>`;
}

/* ---------- 渲染：统计 ---------- */
function renderStats(){
  const t=todayStr();
  const L=state.log[t]||{new:0,rev:0,again:0,hard:0,good:0,easy:0,total:0};
  const total=state.cards.length;
  const byStep={new:0,learn:0,cons:0,mast:0};
  state.cards.forEach(c=>{ if(c.step<0)byStep.new++; else if(c.step<=2)byStep.learn++; else if(c.step<=5)byStep.cons++; else byStep.mast++; });
  const rows=DECK_ORDER.map(d=>{
    const arr=state.cards.filter(c=>c.d===d); if(!arr.length) return '';
    const nw=arr.filter(c=>c.step<0).length;
    const mast=arr.filter(c=>c.step>=6).length;
    const due=arr.filter(c=>c.step>=0&&c.due&&c.due<=t).length;
    const pct=Math.round((arr.length-nw)/arr.length*100);
    return `<tr><td>${esc(deckName(d))}</td><td>${arr.length}</td><td>${arr.length-nw}</td><td>${mast}</td><td>${due}</td><td>${pct}%</td></tr>`;
  }).join('');
  let fc=''; let sum7=0;
  for(let i=0;i<7;i++){
    const d=addDays(t,i);
    const n=state.cards.filter(c=>c.step>=0&&c.due===d).length;
    sum7+=n;
    fc+=`<tr><td>${i===0?'今天':i===1?'明天':fmtDate(d)}</td><td>${n}</td></tr>`;
  }
  const active=Object.keys(state.log).length;
  el=$('#tab-stats');
  el.innerHTML=`
  <div class="panel">
    <h2>今日（${fmtDate(t)}）</h2>
    <div class="grid3">
      <div class="stat"><b>${L.new}</b><span>新卡</span></div>
      <div class="stat"><b>${L.rev}</b><span>复习</span></div>
      <div class="stat"><b>${L.total}</b><span>总张数</span></div>
    </div>
    <p class="muted" style="margin-top:8px">忘记 ${L.again||0} · 模糊 ${L.hard||0} · 记得 ${L.good||0} · 熟练 ${L.easy||0} · 连续打卡 ${state.streak.days||0} 天</p>
  </div>
  <div class="panel">
    <h2>整体掌握情况</h2>
    <div class="grid2">
      <div class="stat"><b>${byStep.mast}</b><span>已掌握（第7档+）</span></div>
      <div class="stat"><b>${byStep.cons}</b><span>巩固中（第4–6档）</span></div>
      <div class="stat"><b>${byStep.learn}</b><span>学习中（第1–3档）</span></div>
      <div class="stat"><b>${byStep.new}</b><span>未学</span></div>
    </div>
    <div class="bar" style="margin-top:10px"><i style="width:${total?Math.round((total-byStep.new)/total*100):0}%"></i></div>
    <p class="footnote">累计学习天数 ${active} 天 · ${draftNewPlan()}</p>
  </div>
  <div class="panel">
    <h2>分科目进度</h2>
    <table><tr><th>科目</th><th>总数</th><th>已学</th><th>掌握</th><th>今日到期</th><th>进度</th></tr>${rows}</table>
  </div>
  <div class="panel">
    <h2>未来7天复习量</h2>
    <table><tr><th>日期</th><th>到期卡片</th></tr>${fc}<tr><td><b>合计</b></td><td><b>${sum7}</b></td></tr></table>
    <p class="footnote">如果某天到期超过120张，说明新卡加太快，可在设置里把每日新卡调低。</p>
  </div>`;
}

/* ---------- 渲染：卡片库 ---------- */
let browseFilter={kw:'',deck:''};
let editingId=null;
function renderBrowse(){
  const el=$('#tab-browse');
  const kw=browseFilter.kw.trim();
  let list=state.cards.filter(c=>{
    if(browseFilter.deck && c.d!==browseFilter.deck) return false;
    if(kw && !(c.q.indexOf(kw)>=0 || c.a.indexOf(kw)>=0)) return false;
    return true;
  });
  const shown=list.slice(0,80);
  el.innerHTML=`
  <div class="panel">
    <h2>检索卡片</h2>
    <div class="row">
      <input type="text" id="bkw" placeholder="搜索关键词，如：诉讼时效 / 公文 / 剩余价值" value="${esc(browseFilter.kw)}" style="flex:1;min-width:200px">
      <select id="bdeck" style="max-width:190px"><option value="">全部科目</option>${DECK_ORDER.map(d=>`<option value="${d}">${esc(deckName(d))}</option>`).join('')}</select>
    </div>
    <p class="muted small" style="margin-top:8px">共 ${list.length} 张${list.length>80?'，显示前80张':''} · 每张卡片都能【编辑】——觉得题干别扭就改顺口</p>
  </div>
  <div class="panel">
    <h2>新建卡片（把错题变成记忆卡）</h2>
    <label class="f">科目</label>
    <select id="nDeck">${DECK_ORDER.map(d=>`<option value="${d}">${esc(deckName(d))}</option>`).join('')}</select>
    <label class="f">问题（正面）</label>
    <textarea id="nQ" style="min-height:60px" placeholder="例：行政机关作出较大数额罚款，听证告知后当事人应在几日内提出？"></textarea>
    <label class="f">答案（背面）</label>
    <textarea id="nA" style="min-height:80px" placeholder="例：5日内；行政机关应在听证7日前通知时间地点。"></textarea>
    <div class="row" style="margin-top:10px">
      <label style="font-size:13px"><input type="checkbox" id="nP"> 标记为高频</label>
      <button class="btn primary" id="btnAdd">加入卡片库</button>
    </div>
  </div>
  <div class="panel cardlist">
    <h2>卡片列表</h2>
    ${shown.map(c=>{
      if(editingId===c.id){
        return `<div class="item" style="border-color:#9db9f5;background:#fbfcff">
          <label class="f">科目</label>
          <select id="ed-${esc(c.id)}">${DECK_ORDER.map(d=>`<option value="${d}" ${d===c.d?'selected':''}>${esc(deckName(d))}</option>`).join('')}</select>
          <label class="f">问题</label>
          <textarea id="eq-${esc(c.id)}" style="min-height:64px">${esc(c.q)}</textarea>
          <label class="f">答案</label>
          <textarea id="ea-${esc(c.id)}" style="min-height:80px">${esc(c.a)}</textarea>
          <div class="row" style="margin-top:8px">
            <button class="btn primary" data-save="${esc(c.id)}">保存</button>
            <button class="btn ghost" data-cancel="1">取消</button>
          </div>
        </div>`;
      }
      return `<div class="item">
        <div class="row" style="justify-content:space-between">
          <div><span class="chip">${esc(deckName(c.d))}</span>${c.p===1?'<span class="chip orange">高频</span>':''}${c.step<0?'<span class="chip gray">未学</span>':'<span class="chip green">第'+(c.step+1)+'档</span>'}</div>
          <div class="row" style="gap:6px">
            <button class="btn ghost small" data-edit="${esc(c.id)}">编辑</button>
            <button class="btn ghost small" data-del="${esc(c.id)}">删除</button>
          </div>
        </div>
        <div class="qq">${esc(c.q)}</div>
        <div class="aa">${esc(c.a)}</div>
      </div>`;
    }).join('')}
  </div>`;
  $('#bkw').oninput=e=>{ browseFilter.kw=e.target.value; renderBrowse(); };
  $('#bdeck').onchange=e=>{ browseFilter.deck=e.target.value; renderBrowse(); };
  $('#bdeck').value=browseFilter.deck;
  $('#btnAdd').onclick=()=>{
    const q=$('#nQ').value.trim(), a=$('#nA').value.trim();
    if(!q||!a){ alert('问题和答案都要填哦'); return; }
    state.cards.push({id:'u'+Date.now(),d:$('#nDeck').value,q:q,a:a,p:$('#nP').checked?1:2,step:-1,due:null,lapses:0,seen:0});
    save(); alert('已加入，今日队列刷新后就能学到它'); renderBrowse();
  };
  $$('[data-edit]').forEach(b=>{ b.onclick=()=>{ editingId=b.getAttribute('data-edit'); renderBrowse(); window.scrollTo({top:0,behavior:'smooth'}); }; });
  $$('[data-cancel]').forEach(b=>{ b.onclick=()=>{ editingId=null; renderBrowse(); }; });
  $$('[data-save]').forEach(b=>{ b.onclick=()=>{
    const id=b.getAttribute('data-save'); const c=cardById(id); if(!c) return;
    const q=document.getElementById('eq-'+id).value.trim(), a=document.getElementById('ea-'+id).value.trim(), d=document.getElementById('ed-'+id).value;
    if(!q||!a){ alert('问题和答案不能为空'); return; }
    c.q=q; c.a=a; if(d) c.d=d;
    editingId=null; save(); renderBrowse();
  };});
  $$('[data-del]').forEach(b=>{ b.onclick=()=>{
    const id=b.getAttribute('data-del');
    const c=cardById(id); if(!c) return;
    if(!confirm('删除这张卡片？\n\n'+c.q)) return;
    state.cards=state.cards.filter(x=>x.id!==id); save(); renderBrowse();
  };});
}

/* ---------- 渲染：设置 ---------- */
function renderSettings(){
  const el=$('#tab-settings');
  el.innerHTML=`
  <div class="panel">
    <h2>基本设置</h2>
    <label class="f">每日新卡数量（建议15–25；考前冲刺可调到25–30，复习量大时系统会自动减量）</label>
    <input type="number" id="cfgNew" min="0" max="60" value="${state.cfg.newPerDay}">
    <label class="f">笔试日期（卡顶部倒计时用它）</label>
    <input type="date" id="cfgDate" value="${esc(state.cfg.examDate)}">
    <div class="row" style="margin-top:12px"><button class="btn primary" id="btnSaveCfg">保存设置</button></div>
  </div>
  <div class="panel">
    <h2>备份与迁移（换手机、防丢进度）</h2>
    <p class="muted small">导出后把这段文字存到备忘录/微信收藏；换设备时粘贴回来导入即可。</p>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="btnExport">生成导出内容</button>
      <button class="btn primary" id="btnImport">导入下方内容</button>
    </div>
    <textarea id="ioArea" placeholder="导出内容会出现在这里；导入时把备份内容粘贴到这里再点“导入”。"></textarea>
  </div>
  <div class="panel">
    <h2>重置</h2>
    <div class="row">
      <button class="btn ghost" id="btnReset">重置全部学习进度（保留自建卡）</button>
    </div>
    <p class="footnote">“重置进度”会把所有卡片退回未学状态，适合想重刷一轮时使用；自建卡片和备份文字不受影响。</p>
  </div>
  <div class="panel">
    <h2>使用小贴士</h2>
    <ul class="tight">
      <li>键盘快捷键：<span class="kbd">空格</span>显示答案，<span class="kbd">1</span>忘记 <span class="kbd">2</span>模糊 <span class="kbd">3</span>记得 <span class="kbd">4</span>熟练。</li>
      <li>每天两次效果最好：早上清复习，晚上学新卡（睡前记忆更牢）。</li>
      <li>数据存在本机浏览器里，换浏览器/清缓存前记得导出备份。</li>
      <li>本文件完全离线运行，不需要网络。</li>
    </ul>
  </div>`;
  $('#btnSaveCfg').onclick=()=>{
    state.cfg.newPerDay=Math.max(0,Math.min(60,parseInt($('#cfgNew').value||'12',10)));
    state.cfg.examDate=$('#cfgDate').value||CFG0.examDate;
    save(); renderHud(); alert('已保存');
  };
  $('#btnExport').onclick=()=>{
    $('#ioArea').value=JSON.stringify({version:1,exported:todayStr(),cfg:state.cfg,streak:state.streak,log:state.log,cards:state.cards});
    $('#ioArea').select();
  };
  $('#btnImport').onclick=()=>{
    const txt=$('#ioArea').value.trim(); if(!txt){ alert('先把备份内容粘贴到下面'); return; }
    try{
      const o=JSON.parse(txt);
      if(!o || !o.cards || !o.cards.length) throw new Error('格式不对');
      state.cards=o.cards.map(c=>({id:c.id||('u'+Math.random()),d:c.d||'其他',q:c.q||'',a:c.a||'',p:c.p||2,step:(typeof c.step==='number'?c.step:-1),due:c.due||null,lapses:c.lapses||0,seen:c.seen||0}));
      if(o.cfg) state.cfg=Object.assign({},CFG0,o.cfg);
      if(o.log) state.log=o.log;
      if(o.streak) state.streak=o.streak;
      mergeDeck(); save(); alert('导入成功'); renderAll();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  $('#btnReset').onclick=()=>{
    if(!confirm('确定重置全部卡片进度吗？')) return;
    state.cards.forEach(c=>{ c.step=-1; c.due=null; c.lapses=0; c.seen=0; });
    state.log={}; state.streak={last:null,days:0}; session=null; save(); renderAll();
  };
}

/* ---------- 标签页 ---------- */
function renderAll(){
  renderToday(); renderPlan(); renderStats(); renderBrowse(); renderSettings();
}
function switchTab(name){
  ['today','plan','stats','browse','settings'].forEach(t=>{ const s=$('#tab-'+t); if(s) s.hidden=(t!==name); });
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===name));
}
function bindTabs(){ $$('#tabs button').forEach(b=>b.onclick=()=>switchTab(b.getAttribute('data-tab'))); }

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',e=>{
  if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')) return;
  if(!session || session.pos>=session.queue.length) return;
  if(e.code==='Space'||e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!session.revealed) reveal(); return; }
  if(session.revealed){ const map={'1':'again','2':'hard','3':'good','4':'easy'}; if(map[e.key]) rate(map[e.key]); }
});

/* ---------- 启动 ---------- */
(function init(){
  if(!LS_OK) $('#banner').classList.add('on');
  load();
  mergeDeck();
  save();
  bindTabs();
  renderAll();
})();
